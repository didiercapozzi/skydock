name: Store package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      identityName:
        description: Package/Identity/Name, as Partner Center shows it under Product identity
        required: false
      publisher:
        description: Package/Identity/Publisher, as Partner Center shows it (CN=...)
        required: false
      publisherDisplayName:
        description: Package/Properties/PublisherDisplayName, as Partner Center shows it
        required: false

jobs:
  store-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The media tools the app carries
        shell: bash
        run: |
          told=$(npx tsx scripts/fetch-tools.ts)
          echo "SKYDOCK_TOOLS_DIR=$told" >> "$GITHUB_ENV"

      - name: What the app carries
        shell: bash
        run: npm run pack

      - name: The window itself
        shell: bash
        run: npm run shell

      - name: The tiles the Store shows, from the app's icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile((Resolve-Path 'packaging/icon.png'))
          New-Item -ItemType Directory -Force 'packaging/appx' | Out-Null
          foreach ($tile in @(
            @('StoreLogo', 50, 50),
            @('Square44x44Logo', 44, 44),
            @('Square150x150Logo', 150, 150),
            @('Wide310x150Logo', 310, 150)
          )) {
            $bitmap = New-Object System.Drawing.Bitmap $tile[1], $tile[2]
            $canvas = [System.Drawing.Graphics]::FromImage($bitmap)
            $canvas.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $side = [Math]::Min($tile[1], $tile[2])
            $canvas.DrawImage($source, [int](($tile[1] - $side) / 2), 0, $side, $side)
            $bitmap.Save((Join-Path (Resolve-Path 'packaging/appx') "$($tile[0]).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $canvas.Dispose()
            $bitmap.Dispose()
          }

      - name: The package, unsigned, as the Store signs it itself
        shell: bash
        run: >
          npx electron-builder --win appx --publish never
          -c.appx.identityName="$IDENTITY_NAME"
          -c.appx.publisher="$PUBLISHER"
          -c.appx.publisherDisplayName="$PUBLISHER_DISPLAY_NAME"
        env:
          IDENTITY_NAME: ${{ inputs.identityName || vars.STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ inputs.publisher || vars.STORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ inputs.publisherDisplayName || vars.STORE_PUBLISHER_DISPLAY_NAME }}

      - uses: actions/upload-artifact@v5
        with:
          name: skydock-store-package
          path: build/installers/*.appx
          if-no-files-found: error

      - name: The Store told where to send the package
        if: github.event_name == 'release'
        uses: microsoft/store-submission@v1
        with:
          command: configure
          type: packaged
          seller-id: ${{ vars.STORE_SELLER_ID }}
          product-id: ${{ vars.STORE_PRODUCT_ID }}
          tenant-id: ${{ secrets.STORE_TENANT_ID }}
          client-id: ${{ secrets.STORE_CLIENT_ID }}
          client-secret: ${{ secrets.STORE_CLIENT_SECRET }}

      - name: The package sent to the Store
        if: github.event_name == 'release'
        uses: microsoft/store-submission@v1
        with:
          command: update
          product-id: ${{ vars.STORE_PRODUCT_ID }}
          package-path: build/installers

      - name: The Store asked to publish it
        if: github.event_name == 'release'
        uses: microsoft/store-submission@v1
        with:
          command: publish
          product-id: ${{ vars.STORE_PRODUCT_ID }}
