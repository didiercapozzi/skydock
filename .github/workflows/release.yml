# The installers, built when a version is tagged: one machine of each kind, since an installer can
# only be made on the system it is for. Ubuntu 22.04 rather than the newest, because a program built
# against an older C library runs on the newer ones too and not the other way round.
#
# A tag is the whole trigger — `npm run release` makes one. Everything lands on a draft release that
# nobody sees until it is published. Started by hand instead, it builds the same installers and
# hangs them on the run itself, so a branch can be tried without releasing anything.
name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # What is being built, checked before four machines spend twenty minutes each on it.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.said.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: What the app says it is
        id: said
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SkyDock $version"

      # A tag saying one thing and an app saying another is the mistake worth stopping for: the
      # installers are named after the app, so nobody would see it until they were asked which
      # version they have. `npm run release` moves both together.
      - name: The tag and the app agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.said.outputs.version }}" ]; then
            echo "::error::the tag is ${{ github.ref_name }} but the app says ${{ steps.said.outputs.version }}"
            exit 1
          fi

  installers:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            args: '--linux'
          - platform: macos-latest
            target: 'aarch64-apple-darwin'
            args: '--mac --arm64'
          - platform: macos-latest
            target: 'x86_64-apple-darwin'
            args: '--mac --x64'
          - platform: windows-latest
            target: ''
            args: '--win'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The machine SkyDock lands on has nothing installed on it, so everything it works with
      # travels with it. These are the two that have to be fetched from somewhere that builds them
      # needing nothing beside them; the build that follows reads this folder, and fetches the tool
      # that reads and writes dates itself.
      - name: The media tools the app carries
        shell: bash
        # In two lines rather than one: a fetch that fails inside the line that writes the answer
        # takes the step's blame with it, and the build then fails much later over an empty folder.
        run: |
          told=$(npx tsx scripts/fetch-tools.ts)
          echo "SKYDOCK_TOOLS_DIR=$told" >> "$GITHUB_ENV"
        env:
          SKYDOCK_TARGET: ${{ matrix.target }}

      # Everything the app carries, then the installers themselves. A tagged run publishes them to
      # the draft release the tag names; one started by hand keeps them on the run, to be downloaded
      # and tried without releasing anything.
      #
      # Nothing here is signed. What an installed SkyDock checks before it replaces itself is the
      # list the release carries and the length of what it downloaded, which this writes as it goes.
      - name: What the app carries
        shell: bash
        run: npm run pack
        env:
          SKYDOCK_TARGET: ${{ matrix.target }}

      # The window's own two files, built from the TypeScript they are written in. The installers
      # are made of this and nothing else: it is what `main` in package.json points at.
      - name: The window itself
        shell: bash
        run: npm run shell

      - name: The installers
        shell: bash
        run: npx electron-builder ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v5
        with:
          name: skydock-${{ matrix.platform }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            build/installers/*.deb
            build/installers/*.AppImage
            build/installers/*.dmg
            build/installers/*.exe
            build/installers/*.msi
          if-no-files-found: ignore
