name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.said.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: What the app says it is
        id: said
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SkyDock $version"

      - name: The tag and the app agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.said.outputs.version }}" ]; then
            echo "::error::the tag is ${{ github.ref_name }} but the app says ${{ steps.said.outputs.version }}"
            exit 1
          fi

  installers:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
            args: '--linux'
          - platform: macos-latest
            target: 'aarch64-apple-darwin'
            args: '--mac --arm64'
          - platform: macos-latest
            target: 'x86_64-apple-darwin'
            args: '--mac --x64'
          - platform: windows-latest
            target: ''
            args: '--win'
    runs-on: ${{ matrix.platform }}
    env:
      SIGNING: ${{ matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: The media tools the app carries
        shell: bash
        run: |
          told=$(npx tsx scripts/fetch-tools.ts)
          echo "SKYDOCK_TOOLS_DIR=$told" >> "$GITHUB_ENV"
        env:
          SKYDOCK_TARGET: ${{ matrix.target }}

      - name: What the app carries
        shell: bash
        run: npm run pack
        env:
          SKYDOCK_TARGET: ${{ matrix.target }}

      - name: The window itself
        shell: bash
        run: npm run shell

      - name: The installers
        shell: bash
        run: npx electron-builder ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/') && env.SIGNING != 'true' && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The Windows installers, before signing
        id: unsigned
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: skydock-windows-unsigned
          path: |
            build/installers/*.exe
            build/installers/*.msi
            !build/installers/__*
          if-no-files-found: error

      - name: Signed by SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      - name: The signed installers in place of the others
        if: env.SIGNING == 'true'
        shell: bash
        run: npx tsx scripts/signed-windows.ts

      - name: The signed installers on the release
        if: env.SIGNING == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          shopt -s nullglob
          files=(build/installers/[!_]*.exe build/installers/[!_]*.exe.blockmap build/installers/*.msi build/installers/latest.yml)
          npx electron-builder publish --policy always --files "${files[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The Microsoft Store package
        if: matrix.platform == 'windows-latest' && vars.MSSTORE_IDENTITY_NAME != ''
        shell: bash
        run: >-
          npx electron-builder --win appx --publish never
          -c.appx.identityName="${{ vars.MSSTORE_IDENTITY_NAME }}"
          -c.appx.publisher="${{ vars.MSSTORE_PUBLISHER }}"

      - name: The Store package, kept with the run
        if: matrix.platform == 'windows-latest' && vars.MSSTORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v5
        with:
          name: skydock-microsoft-store
          path: build/installers/*.appx
          if-no-files-found: error

      - name: The Microsoft Store tools
        if: matrix.platform == 'windows-latest' && vars.MSSTORE_PRODUCT_ID != '' && startsWith(github.ref, 'refs/tags/')
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Sent to the Microsoft Store
        if: matrix.platform == 'windows-latest' && vars.MSSTORE_PRODUCT_ID != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "$env:TENANT" --sellerId "$env:SELLER" --clientId "$env:CLIENT" --clientSecret "$env:SECRET"
          $package = Get-ChildItem build/installers/*.appx | Select-Object -First 1
          msstore publish $package.FullName -id "${{ vars.MSSTORE_PRODUCT_ID }}"
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

      - uses: actions/upload-artifact@v5
        with:
          name: skydock-${{ matrix.platform }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            build/installers/*.deb
            build/installers/*.AppImage
            build/installers/*.dmg
            build/installers/*.exe
            build/installers/*.msi
          if-no-files-found: ignore
