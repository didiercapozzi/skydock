# The installers, built on a tag: one machine of each kind, since an installer can only be made on
# the system it is for. Ubuntu 22.04 rather than the newest, because a program built against an
# older C library runs on the newer ones too and not the other way round.
name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
          - platform: macos-latest
            target: 'aarch64-apple-darwin'
          - platform: macos-latest
            target: 'x86_64-apple-darwin'
          - platform: windows-latest
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache what cargo built
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: What a window needs on Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: The media tools the app carries
        shell: bash
        run: echo "SKYDOCK_TOOLS_DIR=$(node scripts/fetch-tools.mjs)" >> "$GITHUB_ENV"
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SkyDock ${{ github.ref_name }}
          releaseBody: 'Unsigned: on macOS open it from the right-click menu the first time; on Windows choose More info, then Run anyway.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
