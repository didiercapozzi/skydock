<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sky" x1="256" y1="80" x2="256" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Dock/box shape -->
  <rect x="120" y="180" width="272" height="200" rx="24" fill="#1e3a5f" stroke="#60a5fa" stroke-width="4"/>
  <!-- Dock slot -->
  <rect x="140" y="200" width="232" height="60" rx="8" fill="#0f172a"/>
  <!-- Camera body -->
  <rect x="170" y="220" width="80" height="40" rx="6" fill="#334155"/>
  <!-- Camera lens -->
  <circle cx="250" cy="240" r="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="250" cy="240" r="6" fill="#60a5fa"/>
  <!-- Camera top -->
  <rect x="185" y="212" width="30" height="10" rx="3" fill="#475569"/>
  <!-- LED indicator -->
  <circle cx="210" cy="260" r="4" fill="#22c55e"/>
  <!-- Parachute canopy -->
  <path d="M256 80 Q320 100 340 140 Q300 130 256 125 Q212 130 172 140 Q192 100 256 80Z" fill="url(#sky)" opacity="0.9"/>
  <!-- Parachute lines -->
  <line x1="212" y1="135" x2="220" y2="180" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="256" y1="125" x2="256" y2="180" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="135" x2="292" y2="180" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Text -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="-1">SKYDOCK</text>
</svg>
