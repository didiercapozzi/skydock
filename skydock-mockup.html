<title>SkyDock Explorer</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  :root {
    --ground: #f2f4f6;
    --pane: #ffffff;
    --rail: #eaedf1;
    --ink: #171c22;
    --ink-2: #545e6b;
    --ink-3: #8b95a2;
    --line: #dde2e8;
    --line-2: #eef1f4;
    --accent: #0f6f68;
    --accent-soft: #e3f2f0;
    --pick: #2563eb;
    --pick-soft: #e6eefc;
    --local: #a4560a;
    --local-soft: #fbeddc;
    --proc: #0f6f68;
    --proc-soft: #dcefec;
    --up: #1c7a3e;
    --up-soft: #ddf0e2;
    --lock: #7a4fb5;
    --lock-soft: #efe7fa;
    --shadow: 0 1px 2px rgba(20, 28, 38, 0.06), 0 4px 14px rgba(20, 28, 38, 0.05);
    --ui: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --ground: #101418;
      --pane: #171c22;
      --rail: #131820;
      --ink: #e7ecf1;
      --ink-2: #9aa5b2;
      --ink-3: #6b7683;
      --line: #262d36;
      --line-2: #1f252d;
      --accent: #3fb3a6;
      --accent-soft: #14312e;
      --pick: #5b8dee;
      --pick-soft: #182640;
      --local: #d99544;
      --local-soft: #33260f;
      --proc: #3fb3a6;
      --proc-soft: #14312e;
      --up: #57b877;
      --up-soft: #15301e;
      --lock: #b191e2;
      --lock-soft: #241a33;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme='dark'] {
    --ground: #101418;
    --pane: #171c22;
    --rail: #131820;
    --ink: #e7ecf1;
    --ink-2: #9aa5b2;
    --ink-3: #6b7683;
    --line: #262d36;
    --line-2: #1f252d;
    --accent: #3fb3a6;
    --accent-soft: #14312e;
    --pick: #5b8dee;
    --pick-soft: #182640;
    --local: #d99544;
    --local-soft: #33260f;
    --proc: #3fb3a6;
    --proc-soft: #14312e;
    --up: #57b877;
    --up-soft: #15301e;
    --lock: #b191e2;
    --lock-soft: #241a33;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
  }

  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 13.5px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  * {
    box-sizing: border-box;
  }
  button,
  input {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--pick);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 13px;
    flex-wrap: wrap;
    padding: 9px 16px;
    background: var(--pane);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-weight: 700;
    letter-spacing: -0.02em;
    font-size: 15px;
  }
  .brand em {
    font-style: normal;
    color: var(--accent);
  }
  .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .top-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--pane);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 500;
  }
  .btn:hover {
    border-color: var(--ink-3);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover {
    filter: brightness(1.08);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .split {
    display: grid;
    grid-template-columns: 262px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    flex: 1;
    min-height: 0;
  }

  /* ---------------- tree ---------------- */
  /* the menu is pinned: it never scrolls away with the files, and only scrolls itself when the
     list of places is longer than the window */
  .tree {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100%;
    background: var(--rail);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px 8px 24px;
  }
  .tree h2 {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 15px 8px 6px;
    font-weight: 600;
  }
  .tree h2:first-child {
    margin-top: 3px;
  }
  .node {
    display: block;
    width: 100%;
    border: 1px solid transparent;
    background: none;
    border-radius: 6px;
    padding: 6px 8px 5px;
    text-align: left;
    color: var(--ink);
  }
  .node:hover {
    background: var(--line-2);
  }
  .node[aria-current='true'] {
    background: var(--pane);
    border-color: var(--line);
    box-shadow: var(--shadow);
  }
  .node[aria-current='true'] .name {
    font-weight: 600;
  }
  .node.child {
    padding-left: 22px;
  }
  .node .line1 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .node .glyph {
    width: 14px;
    flex: none;
    color: var(--ink-3);
  }
  .node[aria-current='true'] .glyph {
    color: var(--accent);
  }
  .node .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .node .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .node.drop {
    border-color: var(--pick);
    background: var(--pick-soft);
    border-style: dashed;
  }
  .bar {
    display: flex;
    height: 3px;
    border-radius: 2px;
    overflow: hidden;
    margin: 4px 0 0 22px;
    background: var(--line-2);
  }
  .bar i {
    display: block;
    height: 100%;
  }
  .bar .b-local {
    background: var(--local);
  }
  .bar .b-processed {
    background: var(--proc);
  }
  .bar .b-uploaded {
    background: var(--up);
  }
  .todo {
    font-size: 10.5px;
    color: var(--local);
    font-weight: 600;
    margin: 4px 0 0 22px;
  }

  /* ---------------- pane ---------------- */
  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--ground);
  }
  .crumb {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 10px 18px 9px;
    border-bottom: 1px solid var(--line);
    background: var(--pane);
  }
  .crumb .up {
    border: 1px solid var(--line);
    background: var(--pane);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .crumb .trail {
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .crumb .trail b {
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
  }
  .crumb .spacer {
    flex: 1;
  }
  .filter {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--ground);
    border-radius: 6px;
    padding: 3px 9px;
  }
  .filter input {
    border: 0;
    background: none;
    outline: none;
    width: 140px;
    font-size: 12.5px;
  }
  .filter span {
    color: var(--ink-3);
    font-size: 12px;
  }

  /* the one place naming is ever mentioned */
  .saveline {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 7px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--pane);
    font-size: 12px;
    color: var(--ink-2);
  }
  .saveline code {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink);
    background: var(--line-2);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .saveline label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    margin-left: auto;
  }
  .saveline .chips {
    display: flex;
    gap: 5px;
  }

  .scroll {
    overflow-y: auto;
    padding: 4px 18px 40px;
    flex: 1;
  }
  .day {
    position: sticky;
    top: 0;
    z-index: 3;
    margin: 0 -18px;
    padding: 10px 18px 6px;
    background: linear-gradient(var(--ground) 72%, transparent);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
  }

  .band {
    margin: 8px 0 16px;
  }
  .band-head {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 8px 8px 0 0;
    border-bottom-color: var(--line-2);
    background: var(--pane);
  }
  .band.drop .band-head,
  .band.drop .band-body {
    border-color: var(--pick);
    border-style: dashed;
  }
  .grip {
    cursor: grab;
    color: var(--ink-3);
    letter-spacing: -1px;
  }
  .clock {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: none;
    border: 0;
    padding: 0;
    color: var(--ink);
  }
  .clock:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  .meta {
    font-size: 12px;
    color: var(--ink-2);
  }
  .lock {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--lock);
    background: var(--lock-soft);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .acts {
    margin-left: auto;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .mini {
    border: 1px solid var(--line);
    background: var(--pane);
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 11.5px;
    color: var(--ink-2);
  }
  .mini:hover {
    border-color: var(--ink-3);
    color: var(--ink);
  }
  .mini:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .go {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 5px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .go:hover {
    filter: brightness(1.08);
  }
  .go:disabled {
    opacity: 0.45;
    cursor: default;
  }
  .done {
    font-size: 12px;
    font-weight: 600;
    color: var(--up);
  }
  .band-body {
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 8px 8px;
    background: var(--pane);
    padding: 9px;
  }

  .sec {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--pane);
    margin: 8px 0 14px;
  }
  .sec.drop {
    border-color: var(--pick);
    border-style: dashed;
  }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line-2);
  }
  .sec-head h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }
  .sec-body {
    padding: 9px;
  }
  .rule {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 11px 2px 5px;
    color: var(--ink-3);
    font-size: 11px;
    grid-column: 1 / -1;
  }
  .rule:first-child {
    margin-top: 2px;
  }
  .rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-2);
  }
  .rule b {
    font-family: var(--mono);
    font-weight: 600;
    color: var(--ink-2);
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: 10px;
    margin: 10px 0;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--pane);
    padding: 12px;
    text-align: left;
    width: 100%;
    display: block;
  }
  .card:hover {
    border-color: var(--accent);
  }
  .card.drop {
    border-color: var(--pick);
    border-style: dashed;
    background: var(--pick-soft);
  }
  .card h3 {
    margin: 0 0 2px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card .sub {
    margin: 0;
    font-size: 12px;
    color: var(--ink-2);
  }
  .card .strip {
    display: flex;
    gap: 3px;
    margin-top: 10px;
  }
  .card .strip span {
    width: 32px;
    height: 24px;
    border-radius: 3px;
    display: block;
  }
  .card .step {
    margin: 10px 0 0;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
  }

  /* ONE shape for every file. A video is not a different layout, only a badge. */
  .list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 38px;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0 7px;
    background: none;
    text-align: left;
  }
  .row:hover {
    background: var(--line-2);
  }
  .row[aria-selected='true'] {
    background: var(--pick-soft);
    border-color: var(--pick);
  }
  .row .tick {
    width: 14px;
    height: 14px;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    display: grid;
    place-items: center;
    font-size: 9px;
    color: #fff;
  }
  .row[aria-selected='true'] .tick {
    background: var(--pick);
    border-color: var(--pick);
  }
  /* same thumbnail, same size, same x, on every single row */
  .row .thumb {
    width: 40px;
    height: 30px;
    border-radius: 3px;
    flex: none;
    position: relative;
    overflow: hidden;
  }
  .row .thumb i {
    position: absolute;
    left: 2px;
    bottom: 2px;
    font-style: normal;
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1.3;
    background: rgba(0, 0, 0, 0.66);
    color: #fff;
    padding: 0 3px;
    border-radius: 2px;
  }
  .row .fn {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .row .num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    flex: none;
    text-align: right;
  }
  .row .c-time {
    width: 62px;
  }
  .row .c-len {
    width: 44px;
  }
  .row .c-size {
    width: 58px;
  }
  .row .c-state {
    width: 76px;
    flex: none;
    display: flex;
    justify-content: flex-end;
  }
  .status {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 1px 7px;
  }
  .s-local {
    color: var(--local);
    background: var(--local-soft);
  }
  /* prepared once, changed since: it has a copy and the copy is stale */
  .s-changed {
    color: #9a3412;
    background: #fde6d3;
    border: 1px dashed #c2703a;
    padding: 0 6px;
  }
  .navcard {
    margin: 10px 0 0;
  }
  /* the flex rule for .pitem is scoped to .modal, where it had to out-specify .modal label */
  .navcard .pitem {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 6px;
    border-radius: 5px;
  }
  .navcard .pitem:hover {
    background: var(--line-2);
  }
  .navcard .pitem code {
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .navcard .pitem .fixed {
    width: 15px;
    text-align: center;
    flex: none;
  }
  .navcard .dir {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink);
    background: var(--line-2);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .navcard .pitem .what {
    margin-left: auto;
    margin-right: 10px;
  }
  .navcard .linkrow {
    border-top: 1px solid var(--line-2);
    margin-top: 4px;
    padding-top: 8px;
  }
  .navcard .linkrow code {
    font-size: 11px;
    color: var(--accent);
  }
  .navcard .linkrow .spacer {
    flex: 1;
  }
  .sourcenote {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 14px 0 0;
    padding: 8px 12px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .closedcard {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 4px 4px;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .closedcard .spacer {
    flex: 1;
  }
  .lockmark {
    font-size: 10px;
    flex: none;
    opacity: 0.55;
    cursor: help;
  }
  .s-processed {
    color: var(--proc);
    background: var(--proc-soft);
  }
  .s-uploaded {
    color: var(--up);
    background: var(--up-soft);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
  }
  .cell {
    position: relative;
    aspect-ratio: 4/3;
    border-radius: 5px;
    border: 2px solid transparent;
    padding: 0;
    overflow: hidden;
    background: var(--line-2);
    max-width: 100%;
  }
  .cell .art {
    position: absolute;
    inset: 0;
  }
  .cell[aria-selected='true'] {
    border-color: var(--pick);
  }
  .cell .dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--pane);
  }
  .cell i {
    position: absolute;
    left: 4px;
    bottom: 4px;
    font-style: normal;
    font-family: var(--mono);
    font-size: 9px;
    background: rgba(0, 0, 0, 0.66);
    color: #fff;
    padding: 0 4px;
    border-radius: 3px;
  }
  .d-local {
    background: var(--local);
  }
  .d-processed {
    background: var(--proc);
  }
  .d-uploaded {
    background: var(--up);
  }
  /* A card never grows past this. Its files scroll inside it, so the headers of the cards around it
     stay on screen and the page itself stays short. */
  .filebox {
    max-height: 292px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-right: 3px;
  }
  .filebox.short {
    max-height: none;
    overflow: visible;
  }
  /* Dropzone days: one open at a time, everything scrolls in the one pane — no scroll inside a scroll.
     The open day's header and the current hour stay pinned while you scroll through its files. */
  .days {
    --dayhead: 48px;
    margin-top: 8px;
  }
  .dayrow {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--pane);
    margin: 0 0 8px;
  }
  .dayrow.drop {
    border-color: var(--pick);
    border-style: dashed;
  }
  .dayrow-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-radius: 9px;
    background: var(--pane);
  }
  .dayrow.open .dayrow-head {
    position: sticky;
    top: 0;
    z-index: 4;
    border-radius: 9px 9px 0 0;
    border-bottom: 1px solid var(--line-2);
    box-shadow: 0 -8px 0 var(--ground);
  }
  .dayrow-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 0;
    background: none;
    padding: 2px 0;
    text-align: left;
    min-width: 0;
  }
  .dayrow-toggle .chev {
    width: 12px;
    color: var(--ink-3);
    transition: transform 0.15s;
  }
  .dayrow.open .chev {
    transform: rotate(90deg);
    color: var(--accent);
  }
  .dayrow-toggle h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .dayrow:not(.open) .dayrow-head:hover {
    background: var(--line-2);
  }
  .dayrow-head,
  .dayrow-body .rule {
    cursor: pointer;
  }
  /* the line fills the middle; the hour's buttons sit at the right end, like the day's */
  .dayrow-body .rule::after {
    order: 1;
  }
  .dayrow-body .rule .mini {
    order: 2;
    font-family: var(--ui);
  }
  .hours {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .hours button {
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--line);
    background: var(--pane);
    color: var(--ink-2);
    border-radius: 999px;
    padding: 1px 8px;
    font-variant-numeric: tabular-nums;
  }
  .hours button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .hours button span {
    color: var(--ink-3);
    margin-left: 4px;
  }
  /* while something is being dragged, every hour of every day is a place to drop it */
  body.dragging .hours button {
    border-style: dashed;
    border-color: var(--pick);
    color: var(--pick);
    background: var(--pick-soft);
  }
  body.dragging .dayrow-body .rule {
    color: var(--pick);
  }
  .hours button.drop,
  .dayrow-body .rule.drop {
    background: var(--pick) !important;
    color: #fff !important;
    border-style: solid !important;
  }
  .dayrow-body .rule.drop b,
  .dayrow-body .rule.drop .clock {
    color: #fff;
  }
  .clock.edit {
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    cursor: text;
  }
  .timeedit {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .timeedit input {
    font-family: var(--mono);
    font-size: 12px;
    border: 1px solid var(--pick);
    border-radius: 5px;
    background: var(--pane);
    color: var(--ink);
    padding: 2px 5px;
  }
  .timeedit .hint {
    font-size: 11px;
    color: var(--ink-3);
  }
  .picker {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    z-index: 25;
    width: min(620px, calc(100% - 32px));
    max-height: min(420px, 60vh);
    overflow-y: auto;
    background: var(--pane);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    padding: 10px 12px;
  }
  .picker h4 {
    margin: 0 0 8px;
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .picker h4 .mini {
    margin-left: auto;
  }
  .picker .pday {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 6px 0;
    border-top: 1px solid var(--line-2);
  }
  .picker .pday > b {
    font-size: 12px;
    font-weight: 600;
    width: 118px;
    flex: none;
  }
  .dayrow-body {
    padding: 0 9px 9px;
  }
  .loosechip {
    border-style: dashed !important;
  }
  .flatchip {
    font-family: var(--ui) !important;
  }
  .flatchip b {
    color: var(--ink-3);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 10px;
  }
  /* a file's own time is editable, and says so only when you go near it */
  .row .c-time.editable {
    cursor: text;
    border-radius: 3px;
    padding: 1px 3px;
    margin: -1px -3px;
  }
  .row .c-time.editable:hover {
    color: var(--accent);
    text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  .row .timeedit {
    margin-left: auto;
  }
  .rule.loose b {
    color: var(--local);
    font-family: var(--ui);
  }
  /* the group's name leads, its range follows in the quieter voice of a fact about it */
  .rule .jname {
    font-family: var(--ui);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .rule .jspan {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    margin-left: -4px;
  }
  .rule.loose .mini {
    margin-left: 0;
  }
  .daysbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin: 8px 0 0;
  }
  .daysbar .meta {
    margin-right: auto;
  }
  .hchev {
    border: 0;
    background: none;
    padding: 0 2px;
    color: var(--ink-3);
    font-size: 11px;
    width: 16px;
    transition: transform 0.15s;
  }
  .hchev[aria-expanded='true'] {
    transform: rotate(90deg);
    color: var(--accent);
  }
  .rule.shut {
    opacity: 0.85;
  }
  .dayrow-body .rule {
    position: sticky;
    top: var(--dayhead);
    z-index: 3;
    background: var(--pane);
    margin: 0 -9px;
    padding: 8px 11px 5px;
    scroll-margin-top: var(--dayhead);
  }
  .pager {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid var(--line-2);
  }
  .pager .meta {
    margin-right: 2px;
    font-variant-numeric: tabular-nums;
  }
  .pager .count b {
    color: var(--ink);
    font-weight: 600;
  }

  .seg {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    background: var(--pane);
    padding: 5px 11px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .seg button[aria-pressed='true'] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  /* the two halves of a tandem, each carrying how much is in it */
  .kinds button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .kinds .n {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    background: var(--line-2);
    border-radius: 999px;
    padding: 0 6px;
  }
  .kinds button[aria-pressed='true'] .n {
    color: var(--accent);
    background: var(--pane);
  }

  .empty {
    border: 1px dashed var(--line);
    border-radius: 9px;
    padding: 28px 16px;
    text-align: center;
    color: var(--ink-3);
    background: var(--pane);
  }
  .note {
    margin: 12px 0 0;
    padding: 9px 12px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 6px 6px 0;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .note b {
    color: var(--ink);
  }
  .warn {
    border-left-color: var(--local);
    background: var(--local-soft);
  }

  /* ---- network storage ---- */
  .nas {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    background: var(--pane);
    border-radius: 999px;
    padding: 3px 10px 3px 8px;
    font-size: 12px;
  }
  .nas .led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-3);
    flex: none;
  }
  .nas.on .led {
    background: var(--up);
  }
  .nas b {
    font-weight: 600;
  }
  .nas .link {
    border: 0;
    background: none;
    padding: 0;
    color: var(--accent);
    font-size: 12px;
    text-decoration: underline;
  }
  .nas .sep {
    color: var(--line);
  }
  .nasline {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 7px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--pane);
    font-size: 12px;
    color: var(--ink-2);
  }
  .nasline code {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink);
    background: var(--line-2);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .nasline .right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .checking {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .checking .bar {
    width: 130px;
    height: 5px;
    border-radius: 3px;
    background: var(--line-2);
    overflow: hidden;
  }
  .checking .bar i {
    display: block;
    height: 100%;
    background: var(--accent);
  }
  .wasname {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    flex: none;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conflict {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--local);
    background: var(--local-soft);
    border: 1px dashed var(--local);
    border-radius: 3px;
    padding: 0 5px;
    flex: none;
  }

  /* ---- the film, and the two parcels it goes out in ---- */
  .filmstrip {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 10px 0 0;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 9px;
    padding: 9px 12px;
  }
  .filmstrip.done {
    border-color: var(--up);
    background: var(--up-soft);
  }
  .filmstrip .ic {
    color: var(--accent);
  }
  .filmstrip b {
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .filmstrip .right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal.wide {
    width: min(680px, 100%);
  }
  .parcel {
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
  }
  .parcel .ph {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 9px 12px;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .parcel .ph .arrow {
    color: var(--ink-3);
  }
  .parcel .ph .ptag {
    margin-left: auto;
  }
  .pitems {
    padding: 4px 6px;
  }
  .modal .pitem {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 9px;
    padding: 5px 6px;
    border-radius: 5px;
    cursor: pointer;
  }
  .modal .pitem:hover {
    background: var(--line-2);
  }
  .modal .pitem.off {
    opacity: 0.45;
  }
  .modal .pitem input {
    flex: none;
  }
  .pitem code {
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .pitem .fixed {
    color: var(--accent);
    width: 13px;
    text-align: center;
  }
  .pitem .what {
    margin-left: auto;
  }
  /* the one upload strip, wherever an upload is happening */
  .dayrow-head .ustrip,
  .sec-head .ustrip {
    flex: 1 1 100%;
    margin: 2px 0 0;
  }
  .ustrip {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0 0;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .ustrip.ok {
    border-color: var(--up);
    background: var(--up-soft);
  }
  .ustrip b {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .ustrip .bar {
    flex: 1 1 160px;
    max-width: 260px;
    height: 6px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .ustrip .bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    transition: width 0.12s linear;
  }
  .ustrip .pct {
    font-family: var(--mono);
    font-size: 11.5px;
    width: 38px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ustrip .meta {
    flex: 1 1 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kept {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .switchrow {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .switchrow .meta {
    flex: 1 1 200px;
  }
  .explore {
    margin: 0;
    padding: 9px 12px;
    border-left: 3px solid var(--local);
    background: var(--local-soft);
    border-radius: 0 6px 6px 0;
  }
  .modal-back {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(8, 12, 16, 0.5);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .modal {
    width: min(560px, 100%);
    max-height: 100%;
    background: var(--pane);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal h4 {
    margin: 0;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .modal .mbody {
    padding: 14px 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal .mfoot {
    padding: 11px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal .mfoot .spacer {
    flex: 1;
  }
  .modal label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .modal input[type='text'],
  .modal input[type='password'] {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--ground);
    color: var(--ink);
    padding: 6px 9px;
    font-size: 13px;
  }
  .modal .err {
    color: var(--local);
    background: var(--local-soft);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12.5px;
  }
  .crumbs {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .crumbs button {
    border: 0;
    background: none;
    padding: 0 2px;
    color: var(--accent);
    text-decoration: underline;
    font-size: 11.5px;
  }
  .folders {
    border: 1px solid var(--line);
    border-radius: 8px;
    max-height: 260px;
    overflow: auto;
  }
  .folders button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: none;
    text-align: left;
    padding: 7px 11px;
    font-size: 13px;
    border-bottom: 1px solid var(--line-2);
  }
  .folders button:last-child {
    border-bottom: 0;
  }
  .folders button:hover {
    background: var(--line-2);
  }
  .folders button[aria-selected='true'] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .folders .empty2 {
    padding: 16px;
    text-align: center;
    color: var(--ink-3);
    font-size: 12.5px;
  }

  .selbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--ink);
    color: var(--ground);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .selbar {
      background: #232b35;
      color: var(--ink);
    }
  }
  :root[data-theme='dark'] .selbar {
    background: #232b35;
    color: var(--ink);
  }
  .selbar .hint {
    font-size: 11.5px;
    opacity: 0.62;
  }
  .selbar button {
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.1);
    color: inherit;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 12px;
  }
  .selbar button:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  .selbar .right {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }

  .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 76px;
    z-index: 30;
    background: var(--ink);
    color: var(--ground);
    border-radius: 7px;
    padding: 9px 14px;
    font-size: 12.5px;
    box-shadow: var(--shadow);
    max-width: min(560px, calc(100% - 32px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .toast {
      background: #2b3440;
      color: var(--ink);
    }
  }
  :root[data-theme='dark'] .toast {
    background: #2b3440;
    color: var(--ink);
  }

  @media (max-width: 780px) {
    .split {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0, 1fr);
    }
    /* on a phone the menu stays pinned too, as one scrolling strip of places instead of a
       column that would eat half the screen */
    .tree {
      height: auto;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 12px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .tree h2 {
      margin: 0 2px 0 6px;
      flex: none;
    }
    .tree h2:first-child {
      margin-left: 0;
    }
    .tree .node {
      width: auto;
      flex: none;
      padding: 5px 11px;
      border-color: var(--line);
      background: var(--pane);
      border-radius: 999px;
    }
    .tree .node .line1 {
      gap: 6px;
    }
    .tree .node .bar,
    .tree .todo {
      display: none;
    }
    .tree .node.child {
      padding-left: 11px;
    }
    .filter input {
      width: 100px;
    }
    .filebox {
      max-height: 232px;
    }
  }
  /* ---------------- preview + crop ---------------- */
  .flag {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    border-radius: 4px;
    padding: 0 6px;
    white-space: nowrap;
    line-height: 16px;
  }
  .flag.pending {
    color: var(--local);
    background: var(--local-soft);
    border: 1px dashed var(--local);
  }
  .flag.applied {
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
  }
  .cell .flag {
    position: absolute;
    left: 4px;
    top: 4px;
    font-size: 9px;
    padding: 0 4px;
    line-height: 14px;
  }
  .pv-back {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(8, 12, 16, 0.64);
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .pv {
    width: min(1040px, 100%);
    max-height: 100%;
    overflow: hidden;
    background: var(--pane);
    color: var(--ink);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
  }
  .pv-head,
  .pv-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 14px;
  }
  /* head and foot stay put; only the body scrolls, so Save crop is never below the fold */
  .pv-head {
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .pv-foot {
    border-top: 1px solid var(--line);
    flex: none;
  }
  .pv-head .name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
  }

<script>
  ;(function () {
    'use strict'

    /* Auto follows the machine; the other two say so regardless of it. The app carries the same
       switch, writing the same attribute, so the two can be pinned to one theme and held side by
       side — which is the only way to tell a real difference from a different machine setting. */
    ;(function theme() {
      const KEY = 'skydock.theme'
      const apply = (t) => {
        if (t === 'auto') document.documentElement.removeAttribute('data-theme')
        else document.documentElement.setAttribute('data-theme', t)
        document.querySelectorAll('[data-theme-pick]').forEach((b) => {
          b.setAttribute('aria-pressed', b.dataset.themePick === t ? 'true' : 'false')
        })
      }
      let saved = 'auto'
      try {
        const stored = localStorage.getItem(KEY)
        if (stored === 'light' || stored === 'dark') saved = stored
      } catch (e) {}
      document.addEventListener('DOMContentLoaded', () => {
        apply(saved)
        document.querySelectorAll('[data-theme-pick]').forEach((b) => {
          b.addEventListener('click', () => {
            const t = b.dataset.themePick
            try {
              if (t === 'auto') localStorage.removeItem(KEY)
              else localStorage.setItem(KEY, t)
            } catch (e) {}
            apply(t)
          })
        })
      })
      apply(saved)
    })()

    const GAP = 1800
    const DAY1 = Date.UTC(2026, 7, 1, 8, 0, 0) / 1000
    const DAY2 = DAY1 + 86400
    let seq = 0
    const uid = (p) => p + '_' + ++seq

    const mkFile = (t, kind, name) => ({
      id: uid('f'),
      t,
      kind,
      name,
      size:
        kind === 'video'
          ? 380 + Math.floor(Math.random() * 1500)
          : 3 + Math.floor(Math.random() * 6),
      status: 'local',
      dur: kind === 'video' ? 40 + Math.floor(Math.random() * 180) : 0
    })
    const gopro = (n) => 'GX01' + String(n).padStart(4, '0') + '.MP4'
    const still = (n) => 'GOPR' + String(n).padStart(4, '0') + '.JPG'
    const dji = (n) => 'DJI_' + String(n).padStart(4, '0') + '.MP4'

    let vn = 20,
      pn = 1100
    const burst = (start, videos, photos) => {
      const out = []
      let t = start
      for (let i = 0; i < videos; i++) {
        out.push(mkFile(t, 'video', gopro(vn++)))
        t += 95 + Math.floor(Math.random() * 60)
      }
      for (let i = 0; i < photos; i++) {
        out.push(mkFile(t, 'photo', still(pn++)))
        t += 2
      }
      return out.sort((a, b) => a.t - b.t)
    }
    const mkJump = (files, dest, passenger, locked) => ({
      id: uid('j'),
      files,
      dest: dest || null,
      passenger: passenger || null,
      locked: !!locked
    })

    let jumps = [
      mkJump(burst(DAY1 + 1800, 1, 14), 'Yverdon'),
      mkJump(burst(DAY1 + 5400, 2, 9), 'Yverdon'),
      mkJump(burst(DAY1 + 11400, 1, 22), 'Yverdon'),
      mkJump(burst(DAY1 + 19000, 1, 11), 'Gruyère'),
      mkJump(burst(DAY1 + 23000, 2, 17), 'Gruyère'),
      mkJump(burst(DAY1 + 14200, 15, 500), 'Tandems', 'Luc Favre'),
      mkJump(burst(DAY1 + 27400, 12, 340), 'Tandems', 'Chloé Perret'),
      mkJump(burst(DAY2 + 2400, 1, 16), null),
      mkJump(burst(DAY2 + 4100, 2, 8), null),
      mkJump(burst(DAY2 + 9800, 1, 19), null),
      mkJump(
        [mkFile(DAY2 + 12620, 'video', dji(234)), mkFile(DAY2 + 12690, 'video', dji(235))],
        null
      )
    ]
    /* earlier and later days, so a dropzone shows a run of days, each at its own stage */
    const D = (n) => DAY1 + n * 86400
    const more = [
      [D(-3) + 2200, 1, 12, 'Yverdon', 'uploaded'],
      [D(-3) + 6100, 2, 18, 'Yverdon', 'uploaded'],
      [D(-2) + 3000, 1, 9, 'Yverdon', 'uploaded'],
      [D(-2) + 9000, 1, 26, 'Yverdon', 'uploaded'],
      [D(-2) + 15500, 2, 14, 'Yverdon', 'uploaded'],
      [D(-2) + 21000, 1, 7, 'Yverdon', 'uploaded'],
      [D(-1) + 4000, 1, 31, 'Yverdon', 'uploaded'],
      [D(2) + 2600, 2, 16, 'Yverdon', 'local'],
      [D(2) + 8800, 1, 21, 'Yverdon', 'local'],
      [D(3) + 5200, 1, 8, 'Yverdon', 'local'],
      [D(-4) + 3600, 1, 15, 'Gruyère', 'uploaded'],
      [D(-1) + 12000, 2, 19, 'Gruyère', 'uploaded'],
      [D(-1) + 17500, 1, 10, 'Gruyère', 'uploaded'],
      [D(2) + 20000, 1, 22, 'Gruyère', 'processed']
    ]
    more.forEach(([t, v, ph, dest, st]) => {
      const j = mkJump(burst(t, v, ph), dest)
      j.files.forEach((f) => (f.status = st))
      j.preset = true
      jumps.push(j)
    })
    jumps.forEach((j) => {
      if (j.preset) return
      if (j.dest === 'Yverdon') j.files.forEach((f) => (f.status = 'processed'))
      if (j.dest === 'Gruyère') j.files.forEach((f) => (f.status = 'uploaded'))
      if (j.passenger === 'Luc Favre') j.files.forEach((f) => (f.status = 'processed'))
    })

    /* two crops to show both flags: one already cut by Prepare, one waiting for it */
    ;(() => {
      const fitR = (ratio) => {
        const rf = ratio / (16 / 9)
        let w = rf < 1 ? rf : 1,
          h = rf < 1 ? 1 : 1 / rf
        w *= 0.9
        h *= 0.9
        return { x: (1 - w) / 2, y: (1 - h) / 2, w, h }
      }
      const done = jumps[0].files.find((f) => f.kind === 'video')
      done.crop = { ratioKey: '9:16', rect: fitR(9 / 16), in: 8, out: Math.min(done.dur, 52) }
      const waiting = jumps.find(
        (j) => j.dest === 'Yverdon' && j.preset && j.files[0].status === 'local'
      )
      waiting.files
        .filter((f) => f.kind === 'video')
        .forEach((f) => (f.crop = { ratioKey: '1:1', rect: fitR(1), in: 0, out: f.dur }))
    })()

    const DROPZONES = [
      { name: 'Yverdon', keepNames: false },
      { name: 'Gruyère', keepNames: false }
    ]

    /* ------------------------------------------------------------- the NAS
     A pretend Synology. It holds folders and files, and a file on it is only ever identified by its
     bytes — the point of the whole section is that a name and a size are a guess, and a checksum is
     an answer. */
    const NAS_TREE = {
      '/': ['/volume1', '/video'],
      '/volume1': ['/volume1/dropzones', '/volume1/backup', '/volume1/archive'],
      '/volume1/dropzones': ['/volume1/dropzones/Yverdon', '/volume1/dropzones/Gruyère'],
      '/volume1/dropzones/Yverdon': [],
      '/volume1/dropzones/Gruyère': [],
      '/volume1/backup': ['/volume1/backup/rushes'],
      '/volume1/backup/rushes': [],
      '/volume1/archive': [],
      '/video': ['/video/2026'],
      '/video/2026': []
    }
    /* fullRemotePath -> { size, sum } */
    const nasFiles = new Map()

    /* a stand-in for a checksum: the bytes change when the file is cropped or re-timed, and so does this */
    const sumOf = (f) => {
      const seed = f.id + '|' + f.size + '|' + (f.crop ? JSON.stringify(f.crop) : '-')
      let h = 0x811c9dc5
      for (let i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i)
        h = (h * 0x01000193) >>> 0
      }
      return h.toString(16).padStart(8, '0').repeat(4)
    }

    /* What a file is called once it has been processed.
       fun jump — the dropzone, the day it was shot, the time it was shot
       tandem   — the passenger, the jump's day, the time it was shot
     A tandem is one event delivered to one person, so all of it carries the jump's date; a dropzone
     folder holds every day ever shot there, so each file carries its own. Accents and spaces fold
     away, and two files shot in the same second get a counter rather than one overwriting the other. */
    let nameCache = null
    const buildNames = () => {
      const map = new Map()
      const used = new Map()
      const rows = []
      jumps.forEach((j) => j.files.forEach((f) => rows.push({ f, j })))
      rows.sort((a, b) => a.f.t - b.f.t)
      rows.forEach(({ f, j }) => {
        if (!j.dest) return
        let folder, stem
        if (j.dest === 'Tandems') {
          if (!j.passenger) return
          folder = 'Tandems/' + j.passenger + '/' + (f.kind === 'video' ? 'videos' : 'photos')
          stem = slug(j.passenger) + '_' + dayStamp(minT(j)) + '_' + timeStamp(f.t)
        } else {
          const d = dz(j.dest)
          if (d && d.keepNames) {
            map.set(f.id, f.name)
            return
          }
          folder = j.dest
          stem = slug(j.dest) + '_' + dayStamp(f.t) + '_' + timeStamp(f.t)
        }
        const ext = f.kind === 'video' ? '.mp4' : '.jpg'
        if (!used.has(folder)) used.set(folder, new Set())
        const seen = used.get(folder)
        let name = stem + ext,
          n = 1
        while (seen.has(name)) {
          n++
          name = stem + '_' + n + ext
        }
        seen.add(name)
        map.set(f.id, name)
      })
      return map
    }
    const nameOf = (f) => {
      if (!nameCache) nameCache = buildNames()
      return nameCache.get(f.id) || null
    }
    const outputName = (f) => nameOf(f) || f.name
    const nasFolderFor = (destination) => {
      const d = dz(destination)
      if (d && d.path) return d.path
      return state.nas.defaultFolder ? state.nas.defaultFolder + '/' + destination : null
    }
    const remotePathOf = (f, destination) => {
      const dir = nasFolderFor(destination)
      return dir ? dir + '/' + outputName(f) : null
    }
    const dz = (name) => DROPZONES.find((d) => d.name === name)

    const state = {
      node: { kind: 'sort' },
      picked: new Set(),
      pickedJumps: new Set(),
      anchor: null,
      limit: new Map(),
      openDay: new Map(),
      shutHours: new Set(),
      dragging: null,
      q: '',
      view: 'list',
      /* the network storage: a session, the folders chosen for it, and what the last check found */
      /* folders outlive the session: they are the club's layout, not this login's */
      nas: {
        connected: false,
        host: null,
        user: null,
        defaultFolder: '/volume1/dropzones',
        backupFolder: null,
        shareFolder: null,
        checking: null,
        checkedAt: null
      },
      /* how parcels are put together — set once, reused by every tandem after it */
      parcel: { filmToBackup: false, backupAs: 'zip' },
      dialog: null,
      /* videos, photos, or both. One filter for the whole board, so the badge you pressed in a
       dropzone is the one still pressed in a tandem. A tandem offers no "all": 15 clips and 500
       stills are two different jobs. */
      kind: 'all'
    }

    /* ----------------------------------------------------------------- utils */
    const pad = (n) => String(n).padStart(2, '0')
    const hhmm = (t) => {
      const d = new Date(t * 1000)
      return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes())
    }
    const hhmmss = (t) => hhmm(t) + ':' + pad(new Date(t * 1000).getUTCSeconds())
    const MONTHS = [
      'January',
      'February',
      'March',
      'April',
      'May',
      'June',
      'July',
      'August',
      'September',
      'October',
      'November',
      'December'
    ]
    const dayKey = (t) => {
      const d = new Date(t * 1000)
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate())
    }
    const dayLabel = (k) => {
      const p = k.split('-').map(Number)
      return p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0]
    }
    const dayStamp = (t) => {
      const d = new Date(t * 1000)
      return '' + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
    }
    const timeStamp = (t) => {
      const d = new Date(t * 1000)
      return pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds())
    }
    const stamp = (t) => dayStamp(t) + '_' + timeStamp(t)
    const size = (mb) => (mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb + ' MB')
    const mmss = (s) => Math.floor(s / 60) + ':' + pad(s % 60)
    const minT = (j) =>
      Math.min.apply(
        null,
        j.files.map((f) => f.t)
      )
    const maxT = (j) =>
      Math.max.apply(
        null,
        j.files.map((f) => f.t)
      )
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's')
    const slug = (s) =>
      s
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '')
    const art = (t) => {
      const h = (t % 47) * 5 + 185
      return 'linear-gradient(150deg,hsl(' + h + ' 32% 62%),hsl(' + ((h + 28) % 360) + ' 38% 40%))'
    }

    const namedTandems = () => jumps.filter((j) => j.dest === 'Tandems' && j.passenger)
    const unnamedTandems = () => jumps.filter((j) => j.dest === 'Tandems' && !j.passenger)
    const sortingJumps = () => jumps.filter((j) => !j.dest).sort((a, b) => minT(a) - minT(b))
    const jumpsIn = (n) =>
      n.kind === 'sort'
        ? sortingJumps()
        : n.kind === 'dz'
          ? jumps.filter((j) => j.dest === n.name)
          : n.kind === 'tandems'
            ? jumps.filter((j) => j.dest === 'Tandems')
            : n.kind === 'pax'
              ? jumps.filter((j) => j.dest === 'Tandems' && j.passenger === n.name)
              : []
    const allFiles = (l) => l.reduce((a, j) => a.concat(j.files), [])
    /* one gate for every list on the board: the find box and the videos/photos badges */
    const matches = (f) =>
      (state.kind === 'all' || f.kind === state.kind) &&
      (!state.q || f.name.toLowerCase().indexOf(state.q.toLowerCase()) > -1)

    /* the badges themselves — counts are of everything there, never of what the filter left */
    const kindBadges = (files, withAll, onPick) => {
      const seg = document.createElement('span')
      seg.className = 'seg kinds'
      seg.setAttribute('role', 'group')
      seg.setAttribute('aria-label', 'Videos or photos')
      const nV = files.filter((f) => f.kind === 'video').length
      const nP = files.length - nV
      const active = withAll ? state.kind : state.kind === 'photo' ? 'photo' : 'video'
      const opts = withAll
        ? [
            ['all', 'All', files.length],
            ['video', 'Videos', nV],
            ['photo', 'Photos', nP]
          ]
        : [
            ['video', 'Videos', nV],
            ['photo', 'Photos', nP]
          ]
      opts.forEach((o) => {
        const b = document.createElement('button')
        b.type = 'button'
        b.setAttribute('aria-pressed', active === o[0] ? 'true' : 'false')
        b.innerHTML = '<span></span><span class="n"></span>'
        b.querySelector('span').textContent = o[1]
        b.querySelector('.n').textContent = o[2]
        b.title =
          o[0] === 'all' ? 'Show everything' : 'Show only the ' + o[2] + ' ' + o[1].toLowerCase()
        b.addEventListener('click', (e) => {
          e.stopPropagation()
          state.kind = o[0]
          if (onPick) onPick(o[0])
          render()
        })
        seg.appendChild(b)
      })
      return seg
    }

    let toastTimer = null
    const toast = (msg) => {
      const old = document.querySelector('.toast')
      if (old) old.remove()
      const el = document.createElement('div')
      el.className = 'toast'
      el.setAttribute('role', 'status')
      el.textContent = msg
      document.body.appendChild(el)
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => el.remove(), 5000)
    }

    /* ----------------------------------------------- what may still be changed
     Three answers, and every edit asks the same one:
       local      — change it freely, nothing has been made from it yet
       processed  — change it, and the copy that was made is out of date: the file goes back to
                    needing Prepare, and says so rather than quietly reverting
       uploaded   — locked. It is on the storage now; SkyDock cannot take it back (it never deletes
                    over there), so changing this copy would leave the two disagreeing for good. */
    /* what the row says. Three stored states, four shown: a file that was prepared and then changed is
     not "local" in any useful sense — it has a copy, the copy is out of date, and it needs preparing
     again before it can go anywhere. */
    const stateOf = (f) => (f.status === 'local' && f.stale ? 'changed' : f.status)
    const lockedFile = (f) => f.status === 'uploaded'
    const lockedIn = (files) => files.filter(lockedFile)

    /* records that a change happened after a copy was made — the dirty state, derived, not a flag
     anyone has to clear: Prepare removes it by making the copy current again */
    const touchFile = (f) => {
      if (f.status === 'processed') f.stale = true
      if (f.status !== 'local') f.status = 'local'
    }
    const touchAll = (files) => files.forEach(touchFile)

    /* one refusal, worded the same wherever an edit is blocked */
    const refuseLocked = (locked, what) => {
      toast(
        plural(locked.length, 'file') +
          ' ' +
          (locked.length === 1 ? 'is' : 'are') +
          ' on the NAS, so ' +
          (locked.length === 1 ? 'it' : 'they') +
          ' cannot be ' +
          what +
          '. Take ' +
          (locked.length === 1 ? 'it' : 'them') +
          " off the NAS first, in the NAS's own interface."
      )
    }

    /* --------------------------------------------------------- talking to the NAS */
    const nasConnect = (host, user, password) => {
      if (!host.trim() || !user.trim() || !password)
        return 'Host, user and password are all needed.'
      if (password === 'wrong') return 'No such account or incorrect password.'
      state.nas.connected = true
      state.nas.host = host.trim().replace(/^https?:\/\//, '')
      state.nas.user = user.trim()
      state.nas.defaultFolder = state.nas.defaultFolder || '/volume1/dropzones'
      state.dialog = null
      render()
      toast(
        'Connected to ' +
          state.nas.host +
          '. The password is kept encrypted; the session renews itself.'
      )
      return null
    }
    const nasDisconnect = () => {
      state.nas.connected = false
      state.nas.host = null
      state.nas.user = null
      state.dialog = null
      render()
      toast('Disconnected. The folders you chose are remembered.')
    }

    /* The comparison, in the order that costs least. A name and a size narrow it down; only the
     checksum settles it. Anything uncertain is never called a match — the cost of sending a file
     twice is time, the cost of skipping the wrong one is the delivery. */
    const compareOne = (f, destination) => {
      const remote = remotePathOf(f, destination)
      if (!remote) return { verdict: 'nofolder' }
      const there = nasFiles.get(remote)
      if (!there) return { verdict: 'absent', remote }
      if (there.size !== f.size) return { verdict: 'differs', remote, why: 'a different size' }
      if (there.sum !== sumOf(f))
        return { verdict: 'differs', remote, why: 'the same size but different bytes' }
      return { verdict: 'same', remote }
    }

    const checkDropzone = async (destination) => {
      if (!state.nas.connected) {
        state.dialog = { kind: 'connect' }
        render()
        return
      }
      if (!nasFolderFor(destination)) {
        state.dialog = { kind: 'folder', destination }
        render()
        return
      }
      const files = allFiles(jumps.filter((j) => j.dest === destination)).filter(
        (f) => f.status !== 'local'
      )
      if (!files.length) {
        toast('Nothing prepared in ' + destination + ' yet — there is nothing to compare.')
        return
      }

      let same = 0,
        absent = 0,
        differs = 0,
        demoted = 0
      for (let i = 0; i < files.length; i++) {
        const f = files[i]
        state.nas.checking = { destination, done: i, total: files.length, name: f.name }
        if (i % 8 === 0) {
          render()
          await new Promise((r) => setTimeout(r, 45))
        }
        const c = compareOne(f, destination)
        delete f.conflict
        if (f.inArchive) {
          continue
        } /* nothing can look inside an archive: never demote it */
        if (c.verdict === 'same') {
          if (f.status !== 'uploaded') same++
          f.status = 'uploaded'
          f.proof = 'checksum'
        } else if (c.verdict === 'differs') {
          differs++
          f.conflict = c.why
          if (f.status === 'uploaded') {
            f.status = 'processed'
            demoted++
          }
        } else {
          absent++
          if (f.status === 'uploaded') {
            f.status = 'processed'
            demoted++
          }
        }
      }
      state.nas.checking = null
      state.nas.checkedAt = Date.now()
      render()
      const bits = []
      if (same) bits.push(plural(same, 'file') + ' proved already there')
      if (absent) bits.push(plural(absent, 'file') + ' not on the NAS')
      if (differs) bits.push(plural(differs, 'file') + ' with the same name but different bytes')
      /* SkyDock never removes anything from the NAS — if something is gone, a person took it off there */
      if (demoted)
        bits.push(
          plural(demoted, 'file') +
            ' gone from the NAS (removed over there) — back to prepared, ready to send again'
        )
      toast(
        'Checked ' +
          plural(files.length, 'file') +
          ' in ' +
          destination +
          ' · ' +
          (bits.length ? bits.join(' · ') : 'nothing changed') +
          '.'
      )
    }

    /* ------------------------------------------------------- the half-hour rule */
    const splitByGap = (files) => {
      const s = files.slice().sort((a, b) => a.t - b.t)
      const runs = []
      let cur = []
      let last = null
      s.forEach((f) => {
        if (cur.length && f.t - last >= GAP) {
          runs.push(cur)
          cur = []
        }
        cur.push(f)
        last = f.t
      })
      if (cur.length) runs.push(cur)
      return runs
    }

    /* Loose files are a decision, the same as a locked jump: someone put them outside any jump on
     purpose, so the rule never gathers them back up. */
    const untouched = (j) => !j.dest && (j.locked || j.loose)
    const ruleFodder = () => allFiles(jumps.filter((j) => !j.dest && !j.locked && !j.loose))

    const rescan = () => {
      const kept = jumps.filter(untouched)
      const filed = jumps.filter((j) => j.dest)
      const rebuilt = splitByGap(ruleFodder()).map((run) => mkJump(run, null, null, false))
      const looseN = kept.filter((j) => j.loose).reduce((n, j) => n + j.files.length, 0)
      const lockedN = kept.filter((j) => j.locked).length
      jumps = filed.concat(kept, rebuilt).sort((a, b) => minT(a) - minT(b))
      render()
      toast(
        'Rescan · ' +
          plural(rebuilt.length, 'jump') +
          ' re-clustered in the sorting area · ' +
          plural(lockedN, 'locked jump') +
          ' left exactly as you set ' +
          (lockedN === 1 ? 'it' : 'them') +
          (looseN ? ' · ' + plural(looseN, 'loose file') + ' left loose' : '') +
          ' · nothing already filed was touched.'
      )
    }

    /* Same as a rescan, without reading the cameras: unlocked unsorted jumps are pooled and split again
     wherever two files in a row are 30 minutes or more apart. */
    const regroup = () => {
      const before = sortingJumps().filter((j) => !j.locked && !j.loose).length
      const kept = jumps.filter(untouched)
      const filed = jumps.filter((j) => j.dest)
      const rebuilt = splitByGap(ruleFodder()).map((run) => mkJump(run, null, null, false))
      const looseN = kept.filter((j) => j.loose).reduce((n, j) => n + j.files.length, 0)
      const lockedN = kept.filter((j) => j.locked).length
      jumps = filed.concat(kept, rebuilt).sort((a, b) => minT(a) - minT(b))
      render()
      toast(
        'Regrouped · ' +
          plural(before, 'jump') +
          ' → ' +
          plural(rebuilt.length, 'jump') +
          ' by the 30-minute rule' +
          (lockedN
            ? ' · ' +
              plural(lockedN, 'locked jump') +
              ' kept as you set ' +
              (lockedN === 1 ? 'it' : 'them')
            : '') +
          (looseN ? ' · ' + plural(looseN, 'loose file') + ' left loose' : '') +
          '.'
      )
    }

    /* ---------------------------------------------------------------- moves */
    const lockTouched = (j) => {
      if (!j.dest) j.locked = true
    }

    /* A dropzone's files are written flat — Yverdon/yverdon_20260801_083000.mp4 — and the day is what
     Prepare and Send act on. So a jump means nothing once a file is filed there: one day is one
     group of files, and the half-hour rule stops having an opinion. Tandems are untouched; a
     passenger is still one folder. */
    const flattenDest = (name) => {
      if (!name || name === 'Tandems') return
      const mine = jumps.filter((j) => j.dest === name)
      const byD = new Map()
      mine.forEach((j) =>
        j.files.forEach((f) => {
          const k = dayKey(f.t)
          if (!byD.has(k)) byD.set(k, [])
          byD.get(k).push(f)
        })
      )
      jumps = jumps.filter((j) => j.dest !== name)
      byD.forEach((fs) => {
        const j = mkJump(
          fs.sort((a, b) => a.t - b.t),
          name
        )
        j.flat = true
        jumps.push(j)
      })
      jumps.sort((a, b) => minT(a) - minT(b))
    }

    const moveFiles = (ids, target) => {
      /* a file on the NAS stays where it is: moving it would rename or re-file the copy up there,
       and SkyDock has no way to take that one back */
      const all = []
      jumps.forEach((j) =>
        j.files.forEach((f) => {
          if (ids.has(f.id)) all.push(f)
        })
      )
      const locked = lockedIn(all)
      if (locked.length) {
        refuseLocked(locked, 'moved')
        if (locked.length === all.length) {
          render()
          return
        }
        locked.forEach((f) => ids.delete(f.id))
      }
      const moving = []
      jumps.forEach((j) => {
        const keep = []
        j.files.forEach((f) => (ids.has(f.id) ? moving.push(f) : keep.push(f)))
        if (keep.length !== j.files.length) {
          j.files = keep
          lockTouched(j)
        }
      })
      if (!moving.length) return
      /* the copy that was made no longer matches where the file is filed */
      touchAll(moving)
      let where = ''
      if (target.kind === 'pax') {
        const j = namedTandems().find((x) => x.passenger === target.name)
        j.files = j.files.concat(moving).sort((a, b) => a.t - b.t)
        where = target.name + "'s tandem"
      } else if (target.kind === 'jump') {
        const j = jumps.find((x) => x.id === target.id)
        /* Files from another day or another hour belong to this jump, so their camera clock was off:
         they keep their spacing and are re-dated to follow the jump's last file. */
        const lo = minT(j),
          hi = maxT(j)
        const mLo = Math.min.apply(
          null,
          moving.map((f) => f.t)
        )
        const far = moving.some((f) => f.t < lo - GAP || f.t > hi + GAP)
        if (far) {
          const shift = hi + 2 - mLo
          moving.forEach((f) => (f.t += shift))
        }
        j.files = j.files.concat(moving).sort((a, b) => a.t - b.t)
        lockTouched(j)
        where =
          'the ' +
          dayLabel(dayKey(lo)) +
          ' · ' +
          hhmm(lo) +
          ' jump' +
          (far ? ' (re-dated to follow it)' : '')
      } else if (target.kind === 'tandems') {
        splitByGap(moving).forEach((run) => jumps.push(mkJump(run, 'Tandems', null, false)))
        where = 'Tandems, waiting for a name'
      } else if (target.kind === 'dz' || target.kind === 'loose') {
        /* Files moved by hand never make a time section on their own. Dropped on a day they keep their
         time of day and take that day's date; dropped on the place itself they keep their own day.
         Unsorted works exactly like a dropzone here — it just has no destination, so `name` is null
         and the loose group it lands in is the unsorted one for that day. */
        const dest = target.name || null
        if (target.day) {
          const base = Date.parse(target.day + 'T00:00:00Z') / 1000
          moving.forEach((f) => (f.t = base + (((f.t % 86400) + 86400) % 86400)))
        }
        const byD = new Map()
        moving.forEach((f) => {
          const k = dayKey(f.t)
          if (!byD.has(k)) byD.set(k, [])
          byD.get(k).push(f)
        })
        byD.forEach((fs, k) => {
          let lj = jumps.find(
            (x) => x.loose && (x.dest || null) === dest && x.files.length && dayKey(minT(x)) === k
          )
          if (!lj) {
            lj = mkJump([], dest)
            lj.loose = true
            jumps.push(lj)
            /* Files taken out of where you were looking should not make a section unfold under you:
             the list you are reading would slide down and you would lose your place. The new group
             arrives folded, saying how much is in it, and waits to be opened. */
            if (target.quiet) state.shutHours.add('loose-' + k)
          }
          lj.files = lj.files.concat(fs).sort((a, b) => a.t - b.t)
        })
        flattenDest(dest)
        const ok = dest || '__sort'
        /* dropping something somewhere reveals where it landed; taking something away does not */
        if (
          !target.quiet &&
          ((state.node.kind === 'dz' && state.node.name === dest) ||
            (state.node.kind === 'sort' && !dest)) &&
          byD.size === 1
        ) {
          const k = Array.from(byD.keys())[0]
          state.openDay.set(ok, k)
          state.shutHours.delete('loose-' + k)
        }
        where =
          (dest || 'Unsorted jumps') +
          (target.day ? ' · ' + dayLabel(target.day) : '') +
          ' as loose files — drag them onto an hour, or make a jump of them'
      } else {
        splitByGap(moving).forEach((run) => jumps.push(mkJump(run, null, null, false)))
        where = 'the sorting area'
      }
      jumps = jumps.filter((j) => j.files.length > 0).sort((a, b) => minT(a) - minT(b))
      state.picked.clear()
      state.anchor = null
      render()
      toast('Moved ' + plural(moving.length, 'file') + ' to ' + where + '.')
    }

    const moveJumps = (ids, target) => {
      if (target.kind === 'pax') {
        const host = namedTandems().find((x) => x.passenger === target.name)
        const moving = jumps.filter((j) => ids.has(j.id))
        moving.forEach((j) => (host.files = host.files.concat(j.files)))
        host.files.sort((a, b) => a.t - b.t)
        jumps = jumps.filter((j) => !ids.has(j.id)).sort((a, b) => minT(a) - minT(b))
        state.pickedJumps.clear()
        render()
        toast(
          'Folded ' +
            plural(moving.length, 'jump') +
            ' into ' +
            target.name +
            "'s tandem — one passenger is one folder."
        )
        return
      }
      const dest = target.kind === 'dz' ? target.name : target.kind === 'tandems' ? 'Tandems' : null
      let n = 0,
        moved = 0
      jumps.forEach((j) => {
        if (ids.has(j.id)) {
          j.dest = dest
          j.passenger = null
          j.locked = false
          n++
          moved += j.files.length
        }
      })
      flattenDest(dest)
      state.pickedJumps.clear()
      render()
      toast(
        'Filed ' +
          plural(n, 'jump') +
          ' under ' +
          (dest || 'the sorting area') +
          (dest && dest !== 'Tandems'
            ? ' · ' + plural(moved, 'file') + ' in that day, written flat'
            : '') +
          '.'
      )
    }

    const splitJump = (id) => {
      const j = jumps.find((x) => x.id === id)
      const out = j.files.filter((f) => state.picked.has(f.id))
      const stay = j.files.filter((f) => !state.picked.has(f.id))
      if (!out.length || !stay.length) return
      j.files = stay
      lockTouched(j)
      jumps.push(mkJump(out, j.dest, j.passenger, !j.dest))
      jumps.sort((a, b) => minT(a) - minT(b))
      state.picked.clear()
      render()
      toast(
        'Split · ' + plural(out.length, 'file') + ' left for a jump of their own. Both are locked.'
      )
    }

    const mergeUp = (id) => {
      const list = sortingJumps()
      const i = list.findIndex((x) => x.id === id)
      if (i < 1) return
      const prev = list[i - 1],
        cur = list[i]
      prev.files = prev.files.concat(cur.files).sort((a, b) => a.t - b.t)
      prev.locked = true
      jumps = jumps.filter((x) => x.id !== cur.id)
      render()
      toast(
        'Merged into the jump above — ' + plural(prev.files.length, 'file') + ' now, and locked.'
      )
    }

    /* The rule's guess was wrong: these files were not one jump. They stay in the day, in no group,
     and the rule leaves them there. */
    const ungroupJump = (id) => {
      const j = jumps.find((x) => x.id === id)
      if (!j) return
      const n = j.files.length
      moveFiles(new Set(j.files.map((f) => f.id)), { kind: 'loose', name: null })
      toast(
        plural(n, 'file') +
          ' ungrouped — loose in their day now, and the rule will leave them there.'
      )
    }

    const unlock = (id) => {
      jumps.find((x) => x.id === id).locked = false
      render()
      toast('Unlocked — the next rescan will re-cluster it on the half-hour rule.')
    }

    /* Correct a jump's start time in place. Every file shifts by the same amount, so the jump keeps its
     shape — this is how a camera with a wrong clock (or a wrong date) gets put right. */
    const retimeTo = (j, newStart) => {
      const locked = lockedIn(j.files)
      if (locked.length) {
        refuseLocked(locked, 're-timed')
        render()
        return
      }
      const offset = newStart - minT(j)
      if (!offset) {
        render()
        return
      }
      j.files.forEach((f) => {
        f.t += offset
        touchFile(f)
      })
      lockTouched(j)
      jumps.sort((a, b) => minT(a) - minT(b))
      if (state.node.kind === 'dz' || state.node.kind === 'sort')
        state.openDay.set(state.node.kind === 'sort' ? '__sort' : state.node.name, dayKey(newStart))
      render()
      scrollToAnchor('at-' + j.id)
      const mins = Math.round(offset / 60)
      const txt =
        Math.abs(mins) >= 1440
          ? (mins > 0 ? '+' : '−') +
            Math.floor(Math.abs(mins) / 1440) +
            ' d ' +
            (Math.abs(mins) % 1440) +
            ' min'
          : (mins >= 0 ? '+' : '−') + Math.abs(mins) + ' min'
      toast(
        'Jump now starts ' +
          dayLabel(dayKey(newStart)) +
          ' · ' +
          hhmmss(newStart) +
          ' — every file shifted ' +
          txt +
          '.'
      )
    }
    const filesByIds = (ids) => {
      const out = []
      jumps.forEach((j) =>
        j.files.forEach((f) => {
          if (ids.has(f.id)) out.push(f)
        })
      )
      return out.sort((a, b) => a.t - b.t)
    }

    /* Correcting a file's time, on its own or with everything else picked. One camera's clock was
     wrong, so the files shift together and keep their spacing — the earliest one lands on the time
     you typed. A file whose date changes moves to that day, and a dropzone re-flattens around it. */
    const retimeFiles = (files, newStart, anchor) => {
      const locked = lockedIn(files)
      if (locked.length) {
        refuseLocked(locked, 're-timed')
        render()
        return
      }
      const offset =
        newStart -
        Math.min.apply(
          null,
          files.map((f) => f.t)
        )
      if (!offset) {
        render()
        return
      }
      const dests = new Set()
      jumps.forEach((j) => {
        if (j.files.some((f) => files.includes(f))) dests.add(j.dest || null)
      })
      files.forEach((f) => {
        f.t += offset
        touchFile(f)
      })
      /* a file that left its day goes to the day it now belongs to, in the same place */
      dests.forEach((d) => {
        if (d && d !== 'Tandems') flattenDest(d)
        else if (!d) {
          jumps
            .filter((j) => !j.dest)
            .forEach((j) => {
              if (j.files.length) j.locked = true
            })
        }
      })
      jumps = jumps.filter((j) => j.files.length > 0).sort((a, b) => minT(a) - minT(b))
      const ok = state.node.kind === 'sort' ? '__sort' : state.node.name
      if (state.node.kind === 'dz' || state.node.kind === 'sort')
        state.openDay.set(ok, dayKey(newStart))
      render()
      const mins = Math.round(offset / 60)
      const txt =
        Math.abs(mins) >= 1440
          ? (mins > 0 ? '+' : '−') +
            Math.floor(Math.abs(mins) / 1440) +
            ' d ' +
            (Math.abs(mins) % 1440) +
            ' min'
          : (mins >= 0 ? '+' : '−') + Math.abs(mins) + ' min'
      toast(
        files.length === 1
          ? (anchor ? anchor.name : 'The file') +
              ' is now ' +
              dayLabel(dayKey(newStart)) +
              ' · ' +
              hhmmss(newStart) +
              ' (' +
              txt +
              ').'
          : plural(files.length, 'file') +
              ' shifted ' +
              txt +
              ' — the earliest is now ' +
              dayLabel(dayKey(newStart)) +
              ' · ' +
              hhmmss(newStart) +
              ', the rest keep their spacing.'
      )
    }

    const editFileTime = (el, files, anchor) => {
      const start = Math.min.apply(
        null,
        files.map((f) => f.t)
      )
      const form = document.createElement('span')
      form.className = 'timeedit'
      form.innerHTML =
        '<input type="date" aria-label="Date"><input type="time" step="1" aria-label="Time">' +
        '<button type="button" class="mini" data-ok>Apply</button><button type="button" class="mini" data-cancel>Cancel</button>' +
        '<span class="hint"></span>'
      const [dIn, tIn] = form.querySelectorAll('input')
      dIn.value = dayKey(start)
      tIn.value = hhmmss(start)
      form.querySelector('.hint').textContent =
        files.length > 1
          ? 'earliest of ' +
            plural(files.length, 'file') +
            ' · all shift by the same difference · Enter · Esc'
          : 'Enter to apply · Esc to cancel'
      const apply = () => {
        const t =
          Date.parse(
            dIn.value + 'T' + (tIn.value.length === 5 ? tIn.value + ':00' : tIn.value) + 'Z'
          ) / 1000
        if (!isFinite(t)) {
          toast('Not a date and time.')
          return
        }
        retimeFiles(files, t, anchor)
      }
      form.querySelector('[data-ok]').addEventListener('click', apply)
      form.querySelector('[data-cancel]').addEventListener('click', () => render())
      form.addEventListener('keydown', (e) => {
        e.stopPropagation()
        if (e.key === 'Enter') {
          e.preventDefault()
          apply()
        }
        if (e.key === 'Escape') {
          e.preventDefault()
          render()
        }
      })
      ;['click', 'mousedown', 'dragstart'].forEach((ev) =>
        form.addEventListener(ev, (e) => e.stopPropagation())
      )
      el.replaceWith(form)
      tIn.focus()
    }

    const editTime = (el, j) => {
      const start = minT(j)
      const form = document.createElement('span')
      form.className = 'timeedit'
      form.innerHTML =
        '<input type="date" aria-label="Jump date"><input type="time" step="1" aria-label="Jump start time">' +
        '<button type="button" class="mini" data-ok>Apply</button><button type="button" class="mini" data-cancel>Cancel</button>' +
        '<span class="hint">Enter to apply · Esc to cancel</span>'
      const [dIn, tIn] = form.querySelectorAll('input')
      dIn.value = dayKey(start)
      tIn.value = hhmmss(start)
      const apply = () => {
        const t =
          Date.parse(
            dIn.value + 'T' + (tIn.value.length === 5 ? tIn.value + ':00' : tIn.value) + 'Z'
          ) / 1000
        if (!isFinite(t)) {
          toast('Not a date and time.')
          return
        }
        retimeTo(j, t)
      }
      form.querySelector('[data-ok]').addEventListener('click', apply)
      form.querySelector('[data-cancel]').addEventListener('click', () => render())
      form.addEventListener('keydown', (e) => {
        e.stopPropagation()
        if (e.key === 'Enter') {
          e.preventDefault()
          apply()
        }
        if (e.key === 'Escape') {
          e.preventDefault()
          render()
        }
      })
      ;['click', 'mousedown', 'dragstart'].forEach((ev) =>
        form.addEventListener(ev, (e) => e.stopPropagation())
      )
      el.replaceWith(form)
      tIn.focus()
    }

    const nameTandem = (id) => {
      const j = jumps.find((x) => x.id === id)
      const answer = window.prompt('Passenger name — this becomes the folder they get.', '')
      if (!answer || !answer.trim()) return
      j.passenger = answer.trim()
      state.node = { kind: 'pax', name: j.passenger }
      render()
      toast('Named. ' + j.passenger + ' is now one tandem folder.')
    }

    /* ------------------------------------------------------ one upload, one strip
     Every upload in the app runs through here and is drawn by the same strip, wherever it happens:
     under a dropzone's day, under a tandem's card. The phases are the ones worth watching — what is
     being checked, then what is being sent and how far through it is. */
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

    /* A moving bar must not cost a full re-render each frame: the board is thousands of rows. Only the
     strip is repainted while bytes move; the board is rebuilt when the phase changes and at the end. */
    const paintUpload = () => {
      const cur = document.querySelector('.ustrip')
      if (!cur || !state.upload) {
        render()
        return
      }
      const fresh = uploadStrip(state.upload.scope)
      if (!fresh) {
        render()
        return
      }
      /* the same node, refilled — replacing it detaches the element mid-frame */
      cur.className = fresh.className
      cur.innerHTML = fresh.innerHTML
    }

    const runUpload = async (scope, label, items, onEach, finish) => {
      const total = items.length
      state.upload = {
        scope,
        label,
        phase: 'checking',
        done: 0,
        total,
        file: '',
        pct: 0,
        sent: 0,
        skipped: 0
      }
      render()
      /* the comparison first, so nothing already there is sent again */
      for (let i = 0; i < total; i++) {
        state.upload.done = i + 1
        state.upload.file = items[i].name
        if (i % 10 === 0 || i === total - 1) {
          paintUpload()
          await sleep(24)
        }
      }
      const send = items.filter((x) => !x.skip)
