                  ? vids.map((f) => ({
                      icon: '▶',
                      name: nameOf(f) || f.name,
                      size: f.size,
                      what: 'original'
                    }))
                  : [
                      {
                        icon: '🗜',
                        name: backName2 + '.zip',
                        size: j.backedUp.size,
                        what: plural(vids.length, 'original video')
                      }
                    ]
              )
            )
          }
        }

        /* the film, once it exists: the one thing here nobody can make again */
        if (j.film && !j.sent) {
          const strip = document.createElement('div')
          strip.className = 'filmstrip' + (j.sent ? ' done' : '')
          strip.innerHTML =
            '<span class="ic" aria-hidden="true">▶</span><b></b><span class="meta"></span>' +
            '<span class="right"></span>'
          strip.querySelector('b').textContent = j.film.name
          strip.querySelector('.meta').textContent =
            mmss(j.film.mins * 60) +
            ' · ' +
            size(j.film.size) +
            ' · rendered ' +
            hhmm(Math.floor(j.film.at / 1000))
          const right = strip.querySelector('.right')
          if (j.sent) {
            const ok = document.createElement('span')
            ok.className = 'done'
            ok.textContent = '✓ uploaded'
            right.appendChild(ok)
            const link = document.createElement('button')
            link.className = 'mini'
            link.type = 'button'
            link.textContent = 'Copy share link'
            link.addEventListener('click', () => toast('Share link copied: ' + j.sent.share))
            right.appendChild(link)
          }
          s.appendChild(strip)
        }

        const card = document.createElement('div')
        card.className = 'sec'
        const head = document.createElement('div')
        head.className = 'sec-head'
        head.innerHTML =
          '<button class="clock edit" title="Correct the date or time — every file shifts together">' +
          hhmm(minT(j)) +
          '–' +
          hhmm(maxT(j)) +
          '</button>' +
          '<span class="seg kinds" role="group" aria-label="Show videos or photos"></span>' +
          '<span class="acts"></span>'
        head.querySelector('.clock').addEventListener('click', (e) => editTime(e.currentTarget, j))

        head.querySelector('.kinds').replaceWith(kindBadges(j.files, false))

        const acts = head.querySelector('.acts')
        if (j.sent && !j.folded) {
          const fold = document.createElement('button')
          fold.className = 'mini'
          fold.type = 'button'
          fold.textContent = 'Hide the files'
          fold.addEventListener('click', () => {
            j.folded = true
            render()
          })
          acts.appendChild(fold)
        }
        if (shown.length && !(j.sent && j.folded)) {
          const vis = shown.filter(matches)
          const every = vis.length > 0 && vis.every((f) => state.picked.has(f.id))
          const pick = document.createElement('button')
          pick.className = 'mini'
          pick.type = 'button'
          pick.textContent = every ? 'Unselect all' : 'Select all'
          pick.title = every
            ? 'Let go of these files'
            : 'Take all ' +
              vis.length +
              ' shown, to move, re-time or crop them. Which clips end up in the film is decided in kdenlive, not here.'
          pick.addEventListener('click', () => {
            vis.forEach((f) => (every ? state.picked.delete(f.id) : state.picked.add(f.id)))
            render()
          })
          acts.appendChild(pick)
        }
        /* One step at a time: prepare, edit, deliver. The middle one happens in another program, so
         the board's part is to open it and then notice the film that comes back. */
        const go = document.createElement('button')
        go.className = 'go'
        go.type = 'button'
        go.textContent = !ready
          ? 'Prepare'
          : !j.film
            ? 'Open in kdenlive'
            : j.sent
              ? 'Upload again…'
              : 'Upload…'
        go.title = !ready
          ? 'Copy, rename, crop and date this tandem into its folder'
          : !j.film
            ? 'Opens the project with the clips, music and titles already in place'
            : 'Upload the film and the photos, and archive the originals'
        go.addEventListener('click', () => {
          if (!ready) {
            advance([j], n.name + '/')
            return
          }
          if (j.film) {
            state.dialog = { kind: 'deliver', id: j.id }
            render()
            return
          }
          j.editing = true
          render()
          toast(
            'kdenlive is open with the clips laid out, the music in place and the render destination set…'
          )
          setTimeout(() => {
            delete j.editing
            const mins = Math.max(2, Math.round(vids.reduce((n2, f) => n2 + f.dur, 0) / 60 / 4))
            j.film = { name: slug(n.name) + '.mp4', size: mins * 420, at: Date.now(), mins }
            render()
            toast(
              'The film is rendered: ' +
                j.film.name +
                ' · ' +
                mmss(mins * 60) +
                ' · ' +
                size(j.film.size) +
                '. Nothing watches for this — the board looks when you ask it to.'
            )
          }, 1800)
        })
        if (j.editing) {
          go.disabled = true
          go.textContent = 'Editing…'
        }
        /* the originals wait for nothing — archiving them is available the moment they are prepared,
         so the slow part can run while the edit is open */
        if (ready && !j.film) {
          const bk = document.createElement('button')
          bk.className = 'mini'
          bk.type = 'button'
          bk.textContent = j.backedUp ? '✓ originals archived' : 'Back up originals…'
          bk.title = 'The originals do not need the film — this can run while you edit'
          bk.addEventListener('click', () => {
            state.dialog = { kind: 'deliver', id: j.id }
            render()
          })
          acts.appendChild(bk)
        }
        acts.appendChild(go)

        const body = document.createElement('div')
        body.className = 'sec-body'
        /* Once every file is on the NAS the work is over: the card stops being a place to act and
         becomes a record. It folds to one line rather than disappearing — nothing is hidden, it just
         stops presenting 515 rows nobody can change. */
        if (j.sent && j.folded) {
          /* The two cards above already say what is on the NAS. What is left is where it came
             from — a footnote, not a card, and still openable. */
          const sum = document.createElement('p')
          sum.className = 'sourcenote'
          sum.innerHTML = '<span class="lockmark">🔒</span><span></span>'
          sum.querySelector('span:nth-child(2)').textContent =
            'Made from ' +
            plural(j.files.length, 'file') +
            ' on this machine — ' +
            plural(vids.length, 'video') +
            ', ' +
            plural(pics.length, 'photo') +
            '. All on the NAS, so none of them can be changed.'
          const open = document.createElement('button')
          open.className = 'mini'
          open.type = 'button'
          open.textContent = 'Show them'
          open.addEventListener('click', () => {
            j.folded = false
            render()
          })
          sum.appendChild(open)
          s.appendChild(sum)
          return
        }
        if (!shown.length) {
          const e = document.createElement('p')
          e.className = 'meta'
          e.style.margin = '2px'
          e.textContent = 'No ' + (kind === 'video' ? 'videos' : 'photos') + ' in this tandem.'
          body.appendChild(e)
        } else {
          /* 500 stills do not all go on screen at once — the card keeps its height and draws more
           as you reach the bottom of it */
          filesInto(body, shown, j.id + kind, null, false)
        }
        const us = uploadStrip('pax:' + n.name)
        if (us) head.appendChild(us)
        card.appendChild(head)
        card.appendChild(body)
        dropOn(card, { kind: 'pax', name: n.name })
        s.appendChild(card)
      }
    }

    /* ------------------------------------------------------ preview + crop */
    /* Click a file to preview it. On a video, trim the start and end and frame it to a ratio; saving
     puts a crop flag on the file — dashed while it waits for Prepare, solid once it has been applied. */
    /* "Same" is the one you want when something has wandered into the edge of the shot: it keeps the
     footage's own proportions, so you cut the intruder away and the film still fills a normal screen. */
    const RATIOS = [
      ['None', null],
      ['Same', 'same'],
      ['9:16', 9 / 16],
      ['4:5', 4 / 5],
      ['1:1', 1],
      ['16:9', 16 / 9],
      ['Free', 'free']
    ]
    const SRC_W = 3840,
      SRC_H = 2160
    const findFile = (id) => {
      for (const j of jumps) {
        const f = j.files.find((x) => x.id === id)
        if (f) return f
      }
      return null
    }
    const frameAspect = (rot) => (rot % 180 ? 9 / 16 : 16 / 9)
    const fitRect = (ratio, rot) => {
      const rf = ratio / frameAspect(rot || 0)
      let w = rf < 1 ? rf : 1,
        h = rf < 1 ? 1 : 1 / rf
      w *= 0.9
      h *= 0.9
      return { x: (1 - w) / 2, y: (1 - h) / 2, w, h }
    }
    /* a ratio is a number, except "same", which is whatever shape the footage is after any rotation */
    const ratioOf = (key, rot) => {
      const r = RATIOS.find((x) => x[0] === key)
      if (!r) return null
      return r[1] === 'same' ? frameAspect(rot || 0) : r[1]
    }
    const hasCrop = (c, f) => c && (c.rect || c.rot || c.in > 0 || c.out < f.dur)
    const cropText = (c, f) => {
      const parts = []
      if (c.rot) parts.push('↻' + c.rot + '°')
      if (c.rect) parts.push(c.ratioKey)
      if (c.in > 0 || c.out < f.dur)
        parts.push(mmss(Math.round(c.in)) + '–' + mmss(Math.round(c.out)))
      return '✂ ' + parts.join(' · ')
    }
    const cropFlag = (f) => {
      if (!hasCrop(f.crop, f)) return ''
      const done = f.status !== 'local'
      return (
        '<span class="flag ' +
        (done ? 'applied' : 'pending') +
        '" title="' +
        (done
          ? 'Crop applied when this file was prepared'
          : 'Crop saved — applied at the next Prepare') +
        '">' +
        cropText(f.crop, f) +
        (done ? ' ✓' : '') +
        '</span>'
      )
    }

    let pv = null,
      raf = 0
    const openPreview = (id) => {
      const list = laneIds.slice()
      pv = { id, list: list.indexOf(id) > -1 ? list : [id], t: 0, playing: false }
      loadDraft()
      drawPreview()
    }
    const loadDraft = () => {
      const f = findFile(pv.id)
      pv.draft = f.crop
        ? JSON.parse(JSON.stringify(f.crop))
        : { ratioKey: 'None', rect: null, rot: 0, in: 0, out: f.dur }
      pv.draft.rot = pv.draft.rot || 0
      pv.saved = JSON.stringify(pv.draft)
      pv.t = pv.draft.in
      pv.playing = false
    }
    const closePreview = () => {
      cancelAnimationFrame(raf)
      const b = document.querySelector('.pv-back')
      if (b) b.remove()
      pv = null
    }
    const stepPreview = (d) => {
      const i = pv.list.indexOf(pv.id) + d
      if (i < 0 || i >= pv.list.length) return
      pv.id = pv.list[i]
      loadDraft()
      drawPreview()
    }
    const saveCrop = () => {
      const f = findFile(pv.id)
      if (lockedFile(f)) {
        refuseLocked([f], 'cropped')
        return
      }
      const d = pv.draft
      const was = f.status
      if (hasCrop(d, f)) f.crop = d
      else delete f.crop
      touchFile(f)
      let msg
      if (!f.crop) msg = 'Crop removed from ' + f.name + '.'
      else if (was !== 'local')
        msg =
          'Crop saved on ' +
          f.name +
          ' — it was already prepared, so it needs preparing again to be re-cut.'
      else
        msg = 'Crop saved on ' + f.name + ' — the dashed flag turns solid once the day is prepared.'
      closePreview()
      render()
      toast(msg)
    }

    const scene = (f) =>
      '<svg viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true">' +
      '<circle cx="28" cy="20" r="9" fill="rgba(255,255,255,.55)"/><circle cx="36" cy="22" r="7" fill="rgba(255,255,255,.45)"/>' +
      '<circle cx="122" cy="16" r="6" fill="rgba(255,255,255,.4)"/><circle cx="130" cy="18" r="8" fill="rgba(255,255,255,.35)"/>' +
      '<path d="M0 72 Q30 58 60 68 T120 64 T160 66 V90 H0Z" fill="rgba(20,40,30,.55)"/>' +
      '<path d="M0 80 Q40 70 80 78 T160 74 V90 H0Z" fill="rgba(15,30,20,.7)"/>' +
      '<g class="flyer">' +
      '<path d="M-14 0 Q0 -10 14 0 Q0 -4 -14 0Z" fill="' +
      (f.t % 2 ? '#e4572e' : '#f2b134') +
      '"/>' +
      '<line x1="-13" y1="0" x2="0" y2="13" stroke="rgba(0,0,0,.5)" stroke-width=".5"/>' +
      '<line x1="13" y1="0" x2="0" y2="13" stroke="rgba(0,0,0,.5)" stroke-width=".5"/>' +
      '<line x1="-5" y1="-2" x2="0" y2="13" stroke="rgba(0,0,0,.4)" stroke-width=".4"/>' +
      '<line x1="5" y1="-2" x2="0" y2="13" stroke="rgba(0,0,0,.4)" stroke-width=".4"/>' +
      '<circle cx="0" cy="14.5" r="1.6" fill="#1b2430"/></g></svg>'

    const drawPreview = () => {
      cancelAnimationFrame(raf)
      const old = document.querySelector('.pv-back')
      if (old) old.remove()
      const t0 = document.querySelector('.toast')
      if (t0) t0.remove()
      const f = findFile(pv.id)
      if (!f) {
        closePreview()
        return
      }
      const isVid = f.kind === 'video'
      const i = pv.list.indexOf(pv.id)
      const back = document.createElement('div')
      back.className = 'pv-back'
      back.innerHTML =
        '<div class="pv" role="dialog" aria-modal="true" aria-label="Preview">' +
        '<div class="pv-head"><span class="name"></span><span class="meta"></span><span class="flagslot"></span><span class="spacer"></span>' +
        '<span class="meta">' +
        (i + 1) +
        ' / ' +
        pv.list.length +
        '</span>' +
        '<button class="mini" data-prev ' +
        (i <= 0 ? 'disabled' : '') +
        '>‹ Prev</button>' +
        '<button class="mini" data-next ' +
        (i >= pv.list.length - 1 ? 'disabled' : '') +
        '>Next ›</button>' +
        '<button class="mini" data-close title="Close (Esc)">✕</button></div>' +
        '<div class="pv-body"><div class="pv-main"><div class="stagewrap"><div class="stage"><div class="pic" style="background:' +
        art(f.t) +
        '">' +
        scene(f) +
        '</div>' +
        '<span class="tc"></span></div></div>' +
        (isVid
          ? '<div class="transport"><button data-play>▶ Play</button><div class="tl"><div class="track"></div><div class="keep"></div>' +
            '<div class="grab" data-g="in" title="Drag to set the start"></div><div class="grab" data-g="out" title="Drag to set the end"></div>' +
            '<div class="ph"></div></div><span class="t"></span></div>'
          : '') +
        '</div><div class="pv-side"></div></div>' +
        /* a still gets the same footer: a camera mounted sideways produces sideways photos too */
        '<div class="pv-foot">' +
        (lockedFile(f)
          ? '<span class="meta">🔒 On the NAS — cropping is closed. Take it off the NAS to change it.</span>' +
            '<span class="spacer"></span><button class="mini" data-cancel>Close</button>' +
            '<button class="go" data-save disabled>Save crop</button>'
          : '<button class="mini" data-reset>Reset crop</button><span class="dirty" hidden>Unsaved changes</span>' +
            '<span class="spacer"></span><button class="mini" data-cancel>Close</button>' +
            '<button class="go" data-save>Save crop</button>') +
        '</div></div>'
      back.querySelector('.name').textContent = f.name
      back.querySelector('.pv-head .meta').textContent =
        dayLabel(dayKey(f.t)) + ' · ' + hhmmss(f.t) + ' · ' + size(f.size) + ' · ' + f.status
      back.querySelector('.flagslot').innerHTML = cropFlag(f)
      back.addEventListener('click', (e) => {
        if (e.target === back) closePreview()
      })
      back.querySelector('[data-close]').addEventListener('click', closePreview)
      back.querySelector('[data-cancel]').addEventListener('click', closePreview)
      back.querySelector('[data-prev]').addEventListener('click', () => stepPreview(-1))
      back.querySelector('[data-next]').addEventListener('click', () => stepPreview(1))
      document.body.appendChild(back)

      const stage = back.querySelector('.stage')
      const flyer = back.querySelector('.flyer')
      const tc = back.querySelector('.tc')
      const side = back.querySelector('.pv-side')
      const d = pv.draft

      if (!isVid) tc.textContent = 'JPG'

      /* ---- rotation: turns the picture, and a quarter turn makes the output portrait ---- */
      const srcW = () => (d.rot % 180 ? SRC_H : SRC_W),
        srcH = () => (d.rot % 180 ? SRC_W : SRC_H)
      const applyRot = () => {
        stage.classList.toggle('portrait', d.rot % 180 !== 0)
        const pic = stage.querySelector('.pic')
        pic.style.transform = 'translate(-50%,-50%) rotate(' + d.rot + 'deg)'
      }
      const rotate = (by) => {
        const was = d.rot
        d.rot = (d.rot + by) % 360
        /* a quarter turn swaps the picture's shape, so the frame is re-fitted at the same ratio */
        if (d.rect && was % 180 !== d.rot % 180) {
          const raw = RATIOS.find((x) => x[0] === d.ratioKey)[1]
          d.rect = fitRect(raw === 'free' ? frameAspect(d.rot) : ratioOf(d.ratioKey, d.rot), d.rot)
        }
        applyRot()
        drawRect()
        drawSide()
        dirty()
      }
      pv.rotate = rotate

      /* ---- crop frame on the picture ---- */
      let rectEl = null
      const drawRect = () => {
        if (rectEl) rectEl.remove()
        rectEl = null
        if (!d.rect) return
        rectEl = document.createElement('div')
        rectEl.className = 'croprect'
        rectEl.innerHTML =
          '<span class="lab"></span><span class="h nw" data-h="nw"></span><span class="h ne" data-h="ne"></span><span class="h sw" data-h="sw"></span><span class="h se" data-h="se"></span>'
        stage.appendChild(rectEl)
        placeRect()
        rectEl.addEventListener('pointerdown', (e) => {
          e.preventDefault()
          rectEl.setPointerCapture(e.pointerId)
          const box = stage.getBoundingClientRect()
          const h = e.target.dataset.h
          const start = { x: e.clientX, y: e.clientY, r: Object.assign({}, d.rect) }
          const move = (ev) => {
            const dx = (ev.clientX - start.x) / box.width,
              dy = (ev.clientY - start.y) / box.height
            const r = start.r
            if (!h) {
              d.rect.x = Math.min(1 - r.w, Math.max(0, r.x + dx))
              d.rect.y = Math.min(1 - r.h, Math.max(0, r.y + dy))
            } else {
              const ax = h.indexOf('w') > -1 ? r.x + r.w : r.x /* the corner that stays put */
              const ay = h.indexOf('n') > -1 ? r.y + r.h : r.y
              const px = Math.min(1, Math.max(0, (ev.clientX - box.left) / box.width))
              const py = Math.min(1, Math.max(0, (ev.clientY - box.top) / box.height))
              let w = Math.max(0.08, Math.abs(px - ax)),
                hh = Math.max(0.08, Math.abs(py - ay))
              const ratio = ratioOf(d.ratioKey, d.rot)
              if (RATIOS.find((x) => x[0] === d.ratioKey)[1] !== 'free') {
                const rf = ratio / frameAspect(d.rot)
                if (w / hh > rf) w = hh * rf
                else hh = w / rf
              }
              const maxW = h.indexOf('w') > -1 ? ax : 1 - ax,
                maxH = h.indexOf('n') > -1 ? ay : 1 - ay
              if (w > maxW || hh > maxH) {
                const k = Math.min(maxW / w, maxH / hh)
                w *= k
                hh *= k
              }
              d.rect = {
                x: h.indexOf('w') > -1 ? ax - w : ax,
                y: h.indexOf('n') > -1 ? ay - hh : ay,
                w,
                h: hh
              }
            }
            placeRect()
            drawSide()
            dirty()
          }
          const up = () => {
            rectEl.removeEventListener('pointermove', move)
            rectEl.removeEventListener('pointerup', up)
          }
          rectEl.addEventListener('pointermove', move)
          rectEl.addEventListener('pointerup', up)
        })
      }
      const placeRect = () => {
        if (!rectEl) return
        const r = d.rect
        Object.assign(rectEl.style, {
          left: r.x * 100 + '%',
          top: r.y * 100 + '%',
          width: r.w * 100 + '%',
          height: r.h * 100 + '%'
        })
        rectEl.querySelector('.lab').textContent =
          d.ratioKey + ' · ' + Math.round(r.w * srcW()) + '×' + Math.round(r.h * srcH())
      }

      /* ---- trim on the timeline: a still has no duration, so none of this exists for one ---- */
      let drawTimeline = () => {}
      if (isVid) {
        const tl = back.querySelector('.tl')
        const pct = (s) => (s / f.dur) * 100 + '%'
        drawTimeline = () => {
          tl.querySelector('.keep').style.left = pct(d.in)
          tl.querySelector('.keep').style.width = ((d.out - d.in) / f.dur) * 100 + '%'
          tl.querySelector('[data-g="in"]').style.left = pct(d.in)
          tl.querySelector('[data-g="out"]').style.left = pct(d.out)
          tl.querySelector('.ph').style.left = pct(pv.t)
          back.querySelector('.transport .t').textContent =
            mmss(Math.floor(pv.t)) + ' / ' + mmss(f.dur)
          tc.textContent = mmss(Math.floor(pv.t))
          const p = pv.t / f.dur
          flyer.setAttribute(
            'transform',
            'translate(' + (30 + p * 100) + ' ' + (22 + p * 26 + Math.sin(p * 12) * 2) + ')'
          )
        }
        tl.addEventListener('pointerdown', (e) => {
          e.preventDefault()
          tl.setPointerCapture(e.pointerId)
          const g = e.target.dataset.g
          const box = tl.getBoundingClientRect()
          const at = (ev) =>
            Math.min(f.dur, Math.max(0, ((ev.clientX - box.left) / box.width) * f.dur))
          const move = (ev) => {
            const s = at(ev)
            if (g === 'in') {
              d.in = Math.min(s, d.out - 1)
              pv.t = d.in
              dirty()
            } else if (g === 'out') {
              d.out = Math.max(s, d.in + 1)
              pv.t = d.out
              dirty()
            } else pv.t = s
            drawTimeline()
            drawSide()
          }
          move(e)
          const up = () => {
            tl.removeEventListener('pointermove', move)
            tl.removeEventListener('pointerup', up)
          }
          tl.addEventListener('pointermove', move)
          tl.addEventListener('pointerup', up)
        })

        const playBtn = back.querySelector('[data-play]')
        const setPlaying = (on) => {
          pv.playing = on
          playBtn.textContent = on ? '❚❚ Pause' : '▶ Play'
          cancelAnimationFrame(raf)
          if (!on) return
          if (pv.t >= d.out - 0.05 || pv.t < d.in) pv.t = d.in
          let last = performance.now()
          const tick = (now) => {
            if (!pv || !pv.playing) return
            pv.t += ((now - last) / 1000) * 4
            last = now /* 4× speed, so the mockup moves */
            if (pv.t >= d.out) {
              pv.t = d.out
              drawTimeline()
              setPlaying(false)
              return
            }
            drawTimeline()
            raf = requestAnimationFrame(tick)
          }
          raf = requestAnimationFrame(tick)
        }
        playBtn.addEventListener('click', () => setPlaying(!pv.playing))
        pv.toggle = () => setPlaying(!pv.playing)
      }

      /* ---- side panel ---- */
      const dirty = () => {
        const el = back.querySelector('.dirty')
        if (el) el.hidden = JSON.stringify(d) === pv.saved
      }
      /* The panel is built once and then only its values change. Rebuilding it on every rotate or
       ratio click destroyed the button under the pointer, which dropped keyboard focus and the
       focus ring with it — pressing ↻ +90° twice from the keyboard was impossible. */
      side.innerHTML =
        /* a still has nothing to trim; rotating and framing it work exactly as they do on a clip */
        (isVid
          ? '<div><h5>Trim</h5><div class="kv">Start <b data-v="in"></b> · End <b data-v="out"></b></div>' +
            '<div class="kv">Keeps <b data-v="kept"></b> of ' +
            mmss(f.dur) +
            '</div>' +
            '<div class="row2"><button class="mini" data-in>Start at playhead</button><button class="mini" data-out>End at playhead</button></div></div>'
          : '') +
        '<div><h5>Rotate</h5><div class="rot"><span class="deg" data-v="deg"></span>' +
        '<button class="mini" data-r90 title="Turn a quarter clockwise (R)">↻ +90°</button>' +
        '<button class="mini" data-r180 title="Turn upside down">↻ +180°</button>' +
        '<button class="mini" data-r0 title="Back to as shot" hidden>0°</button></div>' +
        '<div class="meta" style="margin-top:4px">For a camera mounted sideways or upside down.</div></div>' +
        '<div><h5>Frame</h5><div class="ratios"></div>' +
        '<div class="kv" style="margin-top:6px"><span data-v="src"></span> → <b data-v="out-px"></b></div>' +
        '<div class="meta" style="margin-top:4px">Drag the frame to move it, a corner to resize.</div></div>' +
        '<div><h5>On the file</h5><div class="flagprev"></div></div>'

      const sv = (name) => side.querySelector('[data-v="' + name + '"]')
      const ratioButtons = new Map()
      const rs = side.querySelector('.ratios')
      RATIOS.forEach(([key, ratio]) => {
        const b = document.createElement('button')
        b.className = 'mini'
        b.type = 'button'
        b.textContent = key
        b.addEventListener('click', () => {
          d.ratioKey = key
          if (ratio === null) d.rect = null
          else if (ratio === 'free') d.rect = d.rect || fitRect(frameAspect(d.rot), d.rot)
          else d.rect = fitRect(ratioOf(key, d.rot), d.rot)
          drawRect()
          drawSide()
          dirty()
        })
        ratioButtons.set(key, b)
        rs.appendChild(b)
      })
      side.querySelector('[data-r90]').addEventListener('click', () => rotate(90))
      side.querySelector('[data-r180]').addEventListener('click', () => rotate(180))
      side.querySelector('[data-r0]').addEventListener('click', () => rotate(360 - d.rot))
      if (isVid) {
        side.querySelector('[data-in]').addEventListener('click', () => {
          d.in = Math.min(pv.t, d.out - 1)
          drawTimeline()
          drawSide()
          dirty()
        })
        side.querySelector('[data-out]').addEventListener('click', () => {
          d.out = Math.max(pv.t, d.in + 1)
          drawTimeline()
          drawSide()
          dirty()
        })
      }

      const drawSide = () => {
        if (isVid) {
          sv('in').textContent = mmss(Math.round(d.in))
          sv('out').textContent = mmss(Math.round(d.out))
          sv('kept').textContent = mmss(Math.round(d.out - d.in))
        }
        sv('deg').textContent = d.rot + '°'
        side.querySelector('[data-r0]').hidden = !d.rot
        ratioButtons.forEach((b, key) =>
          b.setAttribute('aria-pressed', d.ratioKey === key ? 'true' : 'false')
        )
        sv('src').textContent = srcW() + '×' + srcH()
        sv('out-px').textContent = d.rect
          ? Math.round(d.rect.w * srcW()) + '×' + Math.round(d.rect.h * srcH())
          : srcW() + '×' + srcH()
        side.querySelector('.flagprev').innerHTML = hasCrop(d, f)
          ? '<span class="flag pending">' +
            cropText(d, f) +
            '</span><div class="meta" style="margin-top:6px">Dashed until Prepare cuts it, then solid ✓.</div>'
          : '<span class="meta">No crop — the file goes out as shot.</span>'
      }

      if (back.querySelector('[data-reset]'))
        back.querySelector('[data-reset]').addEventListener('click', () => {
          d.ratioKey = 'None'
          d.rect = null
          d.rot = 0
          d.in = 0
          d.out = f.dur
          pv.t = 0
          applyRot()
          drawRect()
          if (isVid) drawTimeline()
          drawSide()
          dirty()
        })
      back.querySelector('[data-save]').addEventListener('click', saveCrop)
      applyRot()
      drawRect()
      if (isVid) drawTimeline()
      drawSide()
      dirty()
    }

    /* No dragging, no scrolling: pick the day and the hour from one short list. */
    const openPicker = () => {
      const old = document.querySelector('.picker')
      if (old) {
        old.remove()
        return
      }
      const t = document.querySelector('.toast')
      if (t) t.remove()
      const name = state.node.name
      const byDay = new Map()
      jumps
        .filter((j) => j.dest === name)
        .forEach((j) => {
          const k = dayKey(minT(j))
          if (!byDay.has(k)) byDay.set(k, [])
          byDay.get(k).push(j)
        })
      const p = document.createElement('div')
      p.className = 'picker'
      p.setAttribute('role', 'dialog')
      p.innerHTML = '<h4></h4>'
      const h = p.querySelector('h4')
      h.textContent =
        'Move ' + plural(state.picked.size, 'file') + ' into which jump of ' + name + '?'
      const close = document.createElement('button')
      close.className = 'mini'
      close.type = 'button'
      close.textContent = 'Cancel'
      close.addEventListener('click', () => p.remove())
      h.appendChild(close)
      Array.from(byDay.keys())
        .sort()
        .reverse()
        .forEach((k) => {
          const row = document.createElement('div')
          row.className = 'pday'
          const b = document.createElement('b')
          b.textContent = dayLabel(k)
          row.appendChild(b)
          const hours = document.createElement('span')
          hours.className = 'hours'
          const lc = document.createElement('button')
          lc.type = 'button'
          lc.className = 'loosechip'
          lc.innerHTML = '<b>◌ loose</b>'
          lc.title = 'Into this day, outside any jump'
          lc.addEventListener('click', () => {
            p.remove()
            moveFiles(new Set(state.picked), { kind: 'loose', name: name, day: k })
          })
          hours.appendChild(lc)
          byDay
            .get(k)
            .filter((j) => !j.loose)
            .sort((a, b2) => minT(a) - minT(b2))
            .forEach((j) => {
              const c = document.createElement('button')
              c.type = 'button'
              c.innerHTML = '<b></b><span></span>'
              c.querySelector('b').textContent = hhmm(minT(j))
              c.querySelector('span').textContent = j.files.length
              c.addEventListener('click', () => {
                p.remove()
                moveFiles(new Set(state.picked), { kind: 'jump', id: j.id })
              })
              hours.appendChild(c)
            })
          row.appendChild(hours)
          p.appendChild(row)
        })
      document.body.appendChild(p)
    }

    /* Delete = "this isn't filed right": every picked file goes back to Unsorted jumps, where the
     half-hour rule regroups it. Nothing is erased. Files already sent to the club stay where they are. */
    const sendBackPicked = () => {
      const ids = Array.from(state.picked)
      if (!ids.length) return
      const where = new Map()
      jumps.forEach((j) => j.files.forEach((f) => where.set(f.id, { f, j })))
      /* Delete means "this isn't filed right". What that costs depends on where the file already is:
       one still in a jump only leaves the jump, one filed in a dropzone comes all the way back, and
       one already sent to the club is not undone by a keystroke. Either way it ends up loose, and
       nothing is erased. */
      const sent = [],
        loosen = [],
        back = [],
        alreadyLoose = []
      ids.forEach((id) => {
        const x = where.get(id)
        if (!x) return
        if (x.f.status === 'uploaded') sent.push(x.f)
        else if (!x.j.dest) (x.j.loose ? alreadyLoose : loosen).push(x.f)
        else back.push(x.f)
      })
      const moving = back.concat(loosen)
      if (!moving.length) {
        toast(
          sent.length
            ? plural(sent.length, 'file') +
                ' already sent to the club — ' +
                (sent.length === 1 ? 'it stays' : 'they stay') +
                ' where ' +
                (sent.length === 1 ? 'it is.' : 'they are.')
            : plural(alreadyLoose.length, 'file') +
                ' already loose — ' +
                (alreadyLoose.length === 1 ? 'it is' : 'they are') +
                ' in no jump as it is.'
        )
        return
      }
      back.forEach(
        (f) => (f.status = 'local')
      ) /* the prepared copy is dropped; the original goes back to sorting */
      const keepPicked = new Set(sent.map((f) => f.id))
      /* A hand move, so it lands loose in its own day rather than being scattered by the rule — and
       quietly, because you are looking at the list these files just left, not at where they went. */
      moveFiles(new Set(moving.map((f) => f.id)), { kind: 'loose', name: null, quiet: true })
      keepPicked.forEach((id) => state.picked.add(id))
      render()
      const bits = []
      if (loosen.length)
        bits.push(
          plural(loosen.length, 'file') +
            ' pulled out of ' +
            (loosen.length === 1 ? 'its jump' : 'their jumps') +
            ' — loose now, in no jump'
        )
      if (back.length)
        bits.push(plural(back.length, 'file') + ' sent back to Unsorted jumps as loose files')
      if (sent.length)
        bits.push(
          plural(sent.length, 'file') + ' already sent to the club stayed put (still selected)'
        )
      if (alreadyLoose.length) bits.push(plural(alreadyLoose.length, 'file') + ' already loose')
      toast(bits.join(' · ') + '.')
    }

    /* The bar only says how many files are picked, and lets you let go of them. */
    const renderSelBar = () => {
      const oldPicker = document.querySelector('.picker')
      if (oldPicker) oldPicker.remove()
      const old = document.querySelector('.selbar')
      if (old) old.remove()
      const nF = state.picked.size,
        nJ = state.pickedJumps.size
      document.getElementById('scroll').style.paddingBottom = nF || nJ ? '120px' : '40px'
      if (!nF && !nJ) return
      const bar = document.createElement('div')
      bar.className = 'selbar'
      bar.innerHTML =
        '<b>' +
        (nF ? plural(nF, 'file') : plural(nJ, 'jump')) +
        ' selected</b>' +
        '<span class="right"><button data-act="clear">Clear (Esc)</button></span>'
      bar.querySelector('[data-act="clear"]').addEventListener('click', () => {
        state.picked.clear()
        state.pickedJumps.clear()
        render()
      })
      document.body.appendChild(bar)
    }

    /* A re-render must never move you. Keeping scrollTop is not enough: anything that appears above
     what you are reading — a loose line, a jump line — slides it down by its own height. So the
     position is kept against a *file*, not a pixel. The first few files on screen are noted, and
     afterwards the first of them still rendered is put back where it was. */
    let lastNodeKey = ''
    const render = () => {
      const sc = document.getElementById('scroll')
      const key = state.node.kind + ':' + (state.node.name || '')
      nameCache =
        null /* times and filing change, so the delivered names are rebuilt with the view */
      const same = key === lastNodeKey
      const top = sc.getBoundingClientRect().top
      const marks = []
      if (same) {
        const onScreen = sc.querySelectorAll('[data-fid]')
        for (const el of onScreen) {
          const y = el.getBoundingClientRect().top
          if (y >= top - 4) marks.push({ id: el.dataset.fid, offset: y - top })
          if (marks.length >= 6) break
        }
      }
      const keep = same ? sc.scrollTop : 0

      renderTree()
      renderCrumb()
      renderSaveline()
      renderNasBar()
      renderNasline()
      renderPane()
      renderSelBar()
      renderDialog()

      sc.scrollTop = keep
      /* the files that were on screen may have moved, been filed elsewhere, or folded away — the
       first one still drawn wins, and a raw scrollTop is the fallback when none of them is */
      for (const m of marks) {
        const el = sc.querySelector('[data-fid="' + m.id + '"]')
        if (!el) continue
        sc.scrollTop = keep + (el.getBoundingClientRect().top - top) - m.offset
        break
      }
      lastNodeKey = key
    }
    /* Land an element just under the open day's pinned header. Measured, not scrollIntoView: the
     hour markers are sticky, and a sticky element reports where it is stuck, not where it lives. */
    const scrollToAnchor = (id) => {
      const sc = document.getElementById('scroll')
      const a = document.getElementById(id)
      if (!a) return
      const head = document.querySelector('.dayrow.open .dayrow-head')
      const isDay = id.indexOf('day-') === 0
      const offset = isDay ? 8 : head ? head.offsetHeight : 0
      const want =
        sc.scrollTop + a.getBoundingClientRect().top - sc.getBoundingClientRect().top - offset
      /* the last hour of the list still lands at the top: lend it just enough room below */
      const short = want - (sc.scrollHeight - sc.clientHeight)
      if (short > 0)
        sc.style.paddingBottom = parseFloat(getComputedStyle(sc).paddingBottom) + short + 'px'
      sc.scrollTop = want
    }

    document.getElementById('rescan').addEventListener('click', rescan)
    const vg = document.getElementById('v-grid'),
      vl = document.getElementById('v-list')
    const setView = (v) => {
      state.view = v
      state.limit.clear() /* a page of rows and a page of thumbnails are not the same size */
      vg.setAttribute('aria-pressed', v === 'grid' ? 'true' : 'false')
      vl.setAttribute('aria-pressed', v === 'list' ? 'true' : 'false')
      render()
    }
    vg.addEventListener('click', () => setView('grid'))
    vl.addEventListener('click', () => setView('list'))
    document.getElementById('next').addEventListener('click', () => {
      const list = sortingJumps()
      if (!list.length) {
        toast('Nothing left to sort.')
        return
      }
      state.node = { kind: 'sort' }
      state.picked.clear()
      state.openDay.set('__sort', dayKey(minT(list[0])))
      state.shutHours.delete(list[0].id)
      render()
      scrollToAnchor('at-' + list[0].id)
      toast(
        'Oldest unsorted jump: ' +
          hhmm(minT(list[0])) +
          ' · ' +
          plural(list[0].files.length, 'file') +
          '.'
      )
    })
    document.addEventListener('keydown', (e) => {
      if (pv) {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return
        if (e.key === 'Escape') {
          e.preventDefault()
          closePreview()
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault()
          stepPreview(-1)
        } else if (e.key === 'ArrowRight') {
          e.preventDefault()
          stepPreview(1)
        } else if (
          (e.key === 'r' || e.key === 'R') &&
          pv.rotate &&
          findFile(pv.id).kind === 'video'
        ) {
          e.preventDefault()
          pv.rotate(90)
        } else if (e.key === ' ' && pv.toggle && findFile(pv.id).kind === 'video') {
          e.preventDefault()
          pv.toggle()
        }
        return
      }
      if (e.key === 'Escape') {
        const pk = document.querySelector('.picker')
        if (pk) {
          pk.remove()
          return
        }
        state.picked.clear()
        state.pickedJumps.clear()
        render()
      }
      if (
        (e.key === 'Delete' || e.key === 'Backspace') &&
        state.picked.size &&
        document.activeElement.tagName !== 'INPUT'
      ) {
        e.preventDefault()
        sendBackPicked()
        return
      }
      if (
        (e.metaKey || e.ctrlKey) &&
        e.key.toLowerCase() === 'a' &&
        document.activeElement.tagName !== 'INPUT'
      ) {
        e.preventDefault()
        laneIds.forEach((id) => state.picked.add(id))
        render()
      }
    })

    /* a day with loose files, so they show up without doing anything */
    ;(() => {
      const src = jumps.find(
        (j) => j.dest === 'Yverdon' && j.preset && dayKey(minT(j)) === '2026-07-31'
      )
      if (src) {
        const lj = mkJump(src.files.splice(src.files.length - 4, 4), 'Yverdon')
        lj.files.forEach((f, i) => (f.t = D(-1) + 6 * 3600 + i * 40))
        lj.loose = true
        jumps.push(lj)
      }
    })()

    /* What the NAS already holds when the app opens. Everything marked uploaded really is there, and
     a handful of files nobody sent from here are there too — put on the NAS by someone else, or by
     last year's version. Those are what the check is for. */
    ;(() => {
      const put = (f, dest, over) => {
        const path = remotePathOf(f, dest)
        if (path) nasFiles.set(path, over || { size: f.size, sum: sumOf(f) })
      }
      jumps.forEach((j) => {
        if (!j.dest || j.dest === 'Tandems') return
        j.files.forEach((f) => {
          if (f.status === 'uploaded') put(f, j.dest)
        })
      })
      /* Already on the NAS, never sent from here — the check will prove these and turn them green.
       They are put in the day that is prepared and waiting to be sent, which is where anyone
       trying this will be looking. */
      const day = '2026-08-01'
      const ready = jumps.filter((j) => j.dest === 'Yverdon' && !j.loose && dayKey(minT(j)) === day)
      const pool = allFiles(ready).sort((a, b) => a.t - b.t)
      pool.slice(0, Math.floor(pool.length * 0.6)).forEach((f) => put(f, 'Yverdon'))
      /* and one the NAS holds under the same name that is not the same file at all */
      const clash = pool[pool.length - 1]
      if (clash) put(clash, 'Yverdon', { size: clash.size + 3, sum: 'deadbeef'.repeat(4) })
    })()

    render()
    setTimeout(
      () =>
        toast(
          'Click any file to preview it. Open Yverdon → 1 August: GX010020.MP4 already has a crop (solid flag), and the 3 August clips show a crop waiting for Prepare (dashed).'
        ),
      900
    )
  })()
</script>
