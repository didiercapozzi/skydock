      state.upload.skipped = total - send.length
      state.upload.phase = 'uploading'
      state.upload.done = 0
      state.upload.total = send.length
      render()
      const steps = send.length > 12 ? [55, 100] : [18, 52, 84, 100]
      const beat = send.length > 12 ? 18 : 70
      for (let i = 0; i < send.length; i++) {
        state.upload.done = i
        state.upload.file = send[i].name
        for (const pct of steps) {
          state.upload.pct = pct
          paintUpload()
          await sleep(beat)
        }
        onEach(send[i])
        state.upload.sent++
      }
      state.upload.phase = 'done'
      state.upload.done = send.length
      render()
      if (finish) finish(state.upload.sent, state.upload.skipped)
      await sleep(4000)
      if (state.upload && state.upload.scope === scope) {
        state.upload = null
        render()
      }
    }

    /* the strip itself — built once, shown wherever the upload it belongs to is happening */
    const uploadStrip = (scope) => {
      const u = state.upload
      if (!u || u.scope !== scope) return null
      const el = document.createElement('div')
      el.className = 'ustrip' + (u.phase === 'done' ? ' ok' : '')
      if (u.phase === 'checking') {
        el.innerHTML =
          '<span>Checking what is already there…</span><b></b><span class="meta"></span>'
        el.querySelector('b').textContent = u.done + ' / ' + u.total
        el.querySelector('.meta').textContent = u.file
      } else if (u.phase === 'uploading') {
        el.innerHTML =
          '<span>Uploading</span><b></b><span class="bar"><i></i></span>' +
          '<span class="pct"></span><span class="meta"></span>'
        el.querySelector('b').textContent = u.done + 1 + ' / ' + u.total
        el.querySelector('i').style.width = u.pct + '%'
        el.querySelector('.pct').textContent = u.pct + '%'
        el.querySelector('.meta').textContent = u.file
      } else {
        el.innerHTML = '<span class="done">✓ uploaded</span><span class="meta"></span>'
        el.querySelector('.meta').textContent =
          plural(u.sent, 'file') + ' sent' + (u.skipped ? ' · ' + u.skipped + ' already there' : '')
      }
      return el
    }

    /* one action at a time, and it is always the next one */
    const advance = (jumpList, label, destination) => {
      const files = allFiles(jumpList)
      const next = files.every((f) => f.status !== 'local') ? 'uploaded' : 'processed'
      if (next === 'processed') {
        files.forEach((f) => {
          f.status = 'processed'
          delete f.stale
        })
        render()
        toast(
          'Prepared · ' +
            plural(files.length, 'file') +
            ' copied, renamed, cropped and dated into ' +
            label +
            '.'
        )
        return
      }
      if (!state.nas.connected) {
        state.dialog = { kind: 'connect' }
        render()
        return
      }
      if (destination && !nasFolderFor(destination)) {
        state.dialog = { kind: 'folder', destination }
        render()
        return
      }
      if (state.upload) {
        toast('One upload at a time — this one is still going.')
        return
      }

      const items = files.map((f) => ({
        f,
        name: nameOf(f) || f.name,
        /* the same comparison the check does: a send never re-sends what is provably there */
        skip: destination ? compareOne(f, destination).verdict === 'same' : false
      }))
      runUpload(
        'dz:' + (destination || label),
        destination || label,
        items,
        (it) => {
          if (destination)
            nasFiles.set(remotePathOf(it.f, destination), { size: it.f.size, sum: sumOf(it.f) })
          delete it.f.conflict
          it.f.proof = 'upload'
          it.f.status = 'uploaded'
        },
        (sent, skipped) => {
          files.forEach((f) => (f.status = 'uploaded'))
          toast(
            'Sent · ' +
              plural(sent, 'file') +
              ' uploaded' +
              (skipped ? ', ' + skipped + ' already there' : '') +
              ' — the share link is copied.'
          )
        }
      )
    }

    /* ------------------------------------------------------------- selection */
    let laneIds = []
    const clickFile = (id, ev) => {
      if (ev.shiftKey && state.anchor) {
        const a = laneIds.indexOf(state.anchor),
          b = laneIds.indexOf(id)
        if (a > -1 && b > -1) {
          const lo = Math.min(a, b),
            hi = Math.max(a, b)
          for (let i = lo; i <= hi; i++) state.picked.add(laneIds[i])
          render()
          return
        }
      }
      if (!state.picked.size && !ev.ctrlKey && !ev.metaKey) {
        state.anchor = id
        openPreview(id)
        return
      }
      if (state.picked.has(id)) state.picked.delete(id)
      else state.picked.add(id)
      state.anchor = id
      render()
    }

    const dropOn = (el, node) => {
      el.addEventListener('dragover', (e) => {
        if (!state.dragging) return
        e.preventDefault()
        e.stopPropagation()
        document.querySelectorAll('.drop').forEach((x) => {
          if (x !== el) x.classList.remove('drop')
        })
        el.classList.add('drop')
      })
      el.addEventListener('dragleave', (e) => {
        if (!el.contains(e.relatedTarget)) el.classList.remove('drop')
      })
      el.addEventListener('drop', (e) => {
        e.preventDefault()
        e.stopPropagation()
        el.classList.remove('drop')
        document.body.classList.remove('dragging')
        const d = state.dragging
        state.dragging = null
        if (!d) return
        if (d.type === 'files') moveFiles(d.ids, node)
        else moveJumps(d.ids, node)
      })
    }
    const dragFile = (el, f) => {
      if (lockedFile(f)) return /* on the NAS: it stays where it is */
      el.draggable = true
      el.addEventListener('dragstart', (e) => {
        state.dragging = {
          type: 'files',
          ids: state.picked.has(f.id) ? new Set(state.picked) : new Set([f.id])
        }
        e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', f.name)
        setTimeout(() => document.body.classList.add('dragging'), 0)
      })
      el.addEventListener('dragend', () => {
        state.dragging = null
        document.body.classList.remove('dragging')
        document.querySelectorAll('.drop').forEach((x) => x.classList.remove('drop'))
      })
    }

    /* ----------------------------------------------------------------- tree */
    const nodeEq = (a, b) => a.kind === b.kind && (a.name || '') === (b.name || '')
    /* `dropAs` lets a place take files differently from how it navigates: dropping on Unsorted jumps
     leaves them loose in their own day rather than running them back through the rule. */
    const treeNode = (node, label, glyph, list, child, dropAs) => {
      const files = allFiles(list)
      const b = document.createElement('button')
      b.className = 'node' + (child ? ' child' : '')
      b.type = 'button'
      b.setAttribute('aria-current', nodeEq(state.node, node) ? 'true' : 'false')
      const c = { local: 0, processed: 0, uploaded: 0 }
      files.forEach((f) => c[f.status]++)
      const tot = files.length || 1
      b.innerHTML =
        '<span class="line1"><span class="glyph" aria-hidden="true">' +
        glyph +
        '</span>' +
        '<span class="name"></span><span class="n">' +
        files.length +
        '</span></span>' +
        (files.length
          ? '<span class="bar">' +
            '<i class="b-local" style="width:' +
            (c.local / tot) * 100 +
            '%"></i>' +
            '<i class="b-processed" style="width:' +
            (c.processed / tot) * 100 +
            '%"></i>' +
            '<i class="b-uploaded" style="width:' +
            (c.uploaded / tot) * 100 +
            '%"></i></span>'
          : '')
      b.querySelector('.name').textContent = label
      b.addEventListener('click', () => {
        state.node = node
        state.picked.clear()
        state.pickedJumps.clear()
        state.q = ''
        render()
      })
      dropOn(b, dropAs || node)
      return b
    }

    const renderTree = () => {
      const t = document.getElementById('tree')
      t.textContent = ''
      const h = (s) => {
        const e = document.createElement('h2')
        e.textContent = s
        t.appendChild(e)
      }
      h('To sort')
      t.appendChild(
        treeNode({ kind: 'sort' }, 'Unsorted jumps', '◇', sortingJumps(), false, {
          kind: 'loose',
          name: null
        })
      )
      h('Dropzones')
      DROPZONES.forEach((d) =>
        t.appendChild(
          treeNode(
            { kind: 'dz', name: d.name },
            d.name,
            '▤',
            jumps.filter((j) => j.dest === d.name)
          )
        )
      )
      h('Tandems')
      t.appendChild(
        treeNode(
          { kind: 'tandems' },
          'All passengers',
          '▤',
          jumps.filter((j) => j.dest === 'Tandems')
        )
      )
      namedTandems()
        .sort((a, b) => a.passenger.localeCompare(b.passenger))
        .forEach((j) =>
          t.appendChild(treeNode({ kind: 'pax', name: j.passenger }, j.passenger, '◔', [j], true))
        )
      if (unnamedTandems().length) {
        const w = document.createElement('div')
        w.className = 'todo'
        w.textContent = unnamedTandems().length + ' waiting for a name'
        t.appendChild(w)
      }
    }

    /* --------------------------------------------------------------- files */
    /* One row shape for every file. The thumbnail is the same size in the same place whether it is a
     photo or a clip; a clip adds a duration badge inside that same square, and nothing moves. */
    /* A row is a div rather than a button so the time inside it can be edited in place: a date and
     time field cannot live inside a button, and clicking one would press it. */
    const fileRow = (f) => {
      const b = document.createElement('div')
      b.className = 'row'
      b.setAttribute('role', 'button')
      b.tabIndex = 0
      b.dataset.fid = f.id
      b.setAttribute('aria-selected', state.picked.has(f.id) ? 'true' : 'false')
      b.innerHTML =
        '<span class="tick" aria-hidden="true">✓</span>' +
        '<span class="thumb" style="background:' +
        art(f.t) +
        (f.crop && f.crop.rot
          ? ';background-image:' + art(f.t).replace('150deg', 150 + f.crop.rot + 'deg')
          : '') +
        '">' +
        (f.kind === 'video' ? '<i>▶ ' + mmss(f.dur) + '</i>' : '') +
        '</span>' +
        '<span class="fn"></span>' +
        '<span class="num c-time' +
        (lockedFile(f) ? '' : ' editable') +
        '"' +
        (lockedFile(f)
          ? ' title="On the NAS — its time is fixed"'
          : ' title="Click to correct the date or time"') +
        '>' +
        hhmmss(f.t) +
        '</span>' +
        '<span class="num c-size">' +
        size(f.size) +
        '</span>' +
        '<span class="c-state"><span class="status s-' +
        stateOf(f) +
        '">' +
        stateOf(f) +
        '</span></span>'
      /* Once a copy exists, the name that matters is the one on disk — it is what goes to the NAS and
       what the passenger sees. The camera's own name stays beside it, quietly, so a file can still be
       traced back to the card it came off. */
      const out = f.status !== 'local' ? nameOf(f) : null
      const fn = b.querySelector('.fn')
      fn.textContent = out || f.name
      if (out) {
        fn.title = out + '  ·  from ' + f.name
        const was = document.createElement('span')
        was.className = 'wasname'
        was.textContent = f.name
        was.title = 'the name it came off the camera with'
        fn.insertAdjacentElement('afterend', was)
      }
      if (f.crop) fn.insertAdjacentHTML('afterend', cropFlag(f))
      if (lockedFile(f)) {
        const lk = document.createElement('span')
        lk.className = 'lockmark'
        lk.textContent = '🔒'
        lk.title = f.inArchive
          ? 'On the NAS, inside ' +
            f.inArchive +
            ' — cropping, re-timing and moving are closed. ' +
            'Changing it now would leave the archive holding something else.'
          : 'On the NAS — cropping, re-timing and moving are closed. Take it off the NAS to change it.'
        b.querySelector('.fn').insertAdjacentElement('afterend', lk)
      }
      if (f.conflict) {
        const c = document.createElement('span')
        c.className = 'conflict'
        c.textContent = '≠ on NAS'
        c.title =
          'The NAS holds a file of this name with ' + f.conflict + '. Sending will overwrite it.'
        b.querySelector('.fn').insertAdjacentElement('afterend', c)
      }
      b.addEventListener('click', (e) => clickFile(f.id, e))
      b.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        e.preventDefault()
        clickFile(f.id, e)
      })
      const tEl = b.querySelector('.c-time')
      if (!lockedFile(f))
        tEl.addEventListener('click', (e) => {
          e.stopPropagation()
          /* a file that is part of the selection retimes the whole selection with it */
          const group =
            state.picked.has(f.id) && state.picked.size > 1 ? filesByIds(state.picked) : [f]
          editFileTime(tEl, group, f)
        })
      dragFile(b, f)
      return b
    }

    /* One tile shape for every file, same aspect ratio, same grid track. */
    const fileTile = (f) => {
      const b = document.createElement('button')
      b.className = 'cell'
      b.type = 'button'
      b.dataset.fid = f.id
      b.title = f.name + ' · ' + hhmmss(f.t) + ' · ' + size(f.size) + ' · ' + f.status
      b.setAttribute('aria-selected', state.picked.has(f.id) ? 'true' : 'false')
      b.innerHTML =
        '<span class="art" style="background:' +
        art(f.t) +
        '"></span>' +
        (f.kind === 'video' ? '<i>▶ ' + mmss(f.dur) + '</i>' : '') +
        cropFlag(f) +
        (state.picked.size ? '<span class="dot d-' + f.status + '"></span>' : '')
      b.addEventListener('click', (e) => clickFile(f.id, e))
      dragFile(b, f)
      return b
    }

    /* A card of 500 photos must not put 500 things on screen, and must not make the page 40 screens
     long either. The card keeps a fixed height and scrolls inside itself; more files are drawn as
     you reach the bottom of it, so there is nothing to click and no page to lose your place on. */
    const CHUNK = () => (state.view === 'list' ? 40 : 120)

    const filesInto = (host, files, key, marks, flat) => {
      const shown = files.filter(matches).sort((a, b) => a.t - b.t)
      if (!shown.length) {
        const e = document.createElement('p')
        e.className = 'meta'
        e.style.padding = '4px 4px 0'
        e.textContent = 'Nothing here matches “' + state.q + '”.'
        host.appendChild(e)
        return
      }

      /* the whole run is pickable whether or not it has been drawn yet */
      shown.forEach((f) => laneIds.push(f.id))

      const scroller = document.createElement('div')
      scroller.className = 'filebox' + (flat || shown.length <= CHUNK() / 2 ? ' short' : '')
      const box = document.createElement('div')
      box.className = state.view === 'list' ? 'list' : 'grid'
      scroller.appendChild(box)

      let drawn = 0
      const draw = (n) => {
        const end = Math.min(drawn + n, shown.length)
        for (let i = drawn; i < end; i++) {
          const mark = marks && marks.get(shown[i].id)
          if (mark) {
            const r = document.createElement('div')
            r.className = 'rule'
            r.innerHTML = '<b></b>'
            r.querySelector('b').textContent = mark.time
            r.append(' ' + mark.text)
            box.appendChild(r)
          }
          box.appendChild(state.view === 'list' ? fileRow(shown[i]) : fileTile(shown[i]))
        }
        drawn = end
        if (label) label.innerHTML = '<b>' + drawn + '</b> of ' + shown.length + ' shown'
      }

      let label = null
      if (shown.length > CHUNK()) {
        label = document.createElement('span')
        label.className = 'meta count'
      }
      draw(flat ? shown.length : CHUNK())

      scroller.addEventListener('scroll', () => {
        if (drawn >= shown.length) return
        if (scroller.scrollTop + scroller.clientHeight > scroller.scrollHeight - 240) draw(CHUNK())
      })
      host.appendChild(scroller)

      if (!label) return
      const foot = document.createElement('div')
      foot.className = 'pager'
      foot.appendChild(label)
      const all = document.createElement('button')
      all.className = 'mini'
      all.type = 'button'
      all.textContent = 'Select all ' + shown.length
      all.title = 'Takes every file in this card, drawn or not'
      all.addEventListener('click', () => {
        shown.forEach((f) => state.picked.add(f.id))
        render()
      })
      foot.appendChild(all)
      host.appendChild(foot)
    }

    const section = (title, sub, files, key, node, extra) => {
      const s = document.createElement('div')
      s.className = 'sec'
      const head = document.createElement('div')
      head.className = 'sec-head'
      head.innerHTML = '<h3></h3><span class="meta"></span><span class="acts"></span>'
      head.querySelector('h3').textContent = title
      head.querySelector('.meta').textContent = sub
      const acts = head.querySelector('.acts')
      const pick = document.createElement('button')
      pick.className = 'mini'
      pick.type = 'button'
      pick.textContent = 'Select all'
      pick.addEventListener('click', () => {
        const vis = files.filter(matches)
        const all = vis.every((f) => state.picked.has(f.id))
        vis.forEach((f) => (all ? state.picked.delete(f.id) : state.picked.add(f.id)))
        render()
      })
      acts.appendChild(pick)
      if (extra) extra(acts)
      const body = document.createElement('div')
      body.className = 'sec-body'
      filesInto(body, files, key)
      s.appendChild(head)
      s.appendChild(body)
      if (node) dropOn(s, node)
      return s
    }

    /* ------------------------------------------------------------ band (sorting) */
    const bandEl = (j, index) => {
      const wrap = document.createElement('div')
      wrap.className = 'band'
      const vids = j.files.filter((f) => f.kind === 'video').length
      const pics = j.files.length - vids
      const pickedHere = j.files.filter((f) => state.picked.has(f.id)).length

      const head = document.createElement('div')
      head.className = 'band-head'
      head.innerHTML =
        '<span class="grip" draggable="true" title="Drag this whole jump" aria-hidden="true">⣿</span>' +
        '<button class="clock edit" title="Correct the date or time — every file shifts together">' +
        hhmm(minT(j)) +
        '–' +
        hhmm(maxT(j)) +
        '</button>' +
        '<span class="meta">' +
        (vids ? plural(vids, 'video') : '') +
        (vids && pics ? ' · ' : '') +
        (pics ? plural(pics, 'photo') : '') +
        '</span>' +
        (j.locked
          ? '<span class="lock" title="Edited by hand — a rescan will not touch it">◆ locked</span>'
          : '') +
        '<span class="acts"></span>'
      head.querySelector('.clock').addEventListener('click', (e) => editTime(e.currentTarget, j))
      const acts = head.querySelector('.acts')
      const add = (label, title, fn, off) => {
        const b = document.createElement('button')
        b.className = 'mini'
        b.type = 'button'
        b.textContent = label
        b.title = title
        b.disabled = !!off
        b.addEventListener('click', fn)
        acts.appendChild(b)
      }
      add('Select jump', 'Take every file in this jump', () => {
        const all = j.files.every((f) => state.picked.has(f.id))
        j.files.forEach((f) => (all ? state.picked.delete(f.id) : state.picked.add(f.id)))
        render()
      })
      add(
        'Split here',
        pickedHere ? 'Move the ' + pickedHere + ' picked file(s) out' : 'Pick some files first',
        () => splitJump(j.id),
        !pickedHere
      )
      add(
        'Merge up',
        index === 0 ? 'Nothing above' : 'Join the jump above',
        () => mergeUp(j.id),
        index === 0
      )
      if (j.locked)
        add('Re-apply rule', 'Unlock — let the half-hour rule group this again', () => unlock(j.id))

      head.querySelector('.grip').addEventListener('dragstart', (e) => {
        state.dragging = {
          type: 'jumps',
          ids: state.pickedJumps.has(j.id) ? new Set(state.pickedJumps) : new Set([j.id])
        }
        e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', 'jump')
      })
      head.querySelector('.grip').addEventListener('dragend', () => {
        state.dragging = null
      })

      const body = document.createElement('div')
      body.className = 'band-body'
      filesInto(body, j.files, j.id)
      wrap.appendChild(head)
      wrap.appendChild(body)
      dropOn(wrap, { kind: 'jump', id: j.id })
      return wrap
    }

    /* ---------------------------------------------------------------- chrome */
    const renderCrumb = () => {
      const n = state.node
      const c = document.getElementById('crumb')
      c.textContent = ''
      if (n.kind === 'pax') {
        const up = document.createElement('button')
        up.className = 'up'
        up.type = 'button'
        up.textContent = '↰ Tandems'
        up.addEventListener('click', () => {
          state.node = { kind: 'tandems' }
          state.picked.clear()
          render()
        })
        c.appendChild(up)
      }
      const trail = document.createElement('span')
      trail.className = 'trail'
      const label =
        n.kind === 'sort' ? 'Unsorted jumps' : n.kind === 'tandems' ? 'All passengers' : n.name
      trail.innerHTML = (n.kind === 'pax' ? 'Tandems / ' : '') + '<b></b>'
      trail.querySelector('b').textContent = label
      c.appendChild(trail)

      const list = jumpsIn(n)
      const files = allFiles(list)
      const meta = document.createElement('span')
      meta.className = 'meta'
      meta.textContent =
        n.kind === 'pax' || n.kind === 'tandems'
          ? plural(files.length, 'file')
          : /* a dropzone has days and files; jumps stop being a thing the moment they are filed there */
            n.kind === 'dz'
            ? plural(new Set(files.map((f) => dayKey(f.t))).size, 'day') +
              ' · ' +
              plural(files.length, 'file')
            : plural(list.filter((j) => !j.loose).length, 'jump') +
              ' · ' +
              plural(files.length, 'file')
      c.appendChild(meta)

      const sp = document.createElement('span')
      sp.className = 'spacer'
      c.appendChild(sp)
      const f = document.createElement('label')
      f.className = 'filter'
      f.innerHTML = '<span aria-hidden="true">⌕</span><input id="q" placeholder="Find a file">'
      c.appendChild(f)
      const input = f.querySelector('input')
      input.value = state.q
      input.addEventListener('input', () => {
        state.q = input.value
        render()
        const q = document.getElementById('q')
        q.focus()
        q.setSelectionRange(q.value.length, q.value.length)
      })
    }

    /* ------------------------------------------------------------ the two dialogs */
    const renderDialog = () => {
      const old = document.querySelector('.modal-back')
      if (old) old.remove()
      const d = state.dialog
      if (!d) return
      const back = document.createElement('div')
      back.className = 'modal-back'
      const close = () => {
        state.dialog = null
        render()
      }
      back.addEventListener('click', (e) => {
        if (e.target === back) close()
      })

      if (d.kind === 'connect') {
        back.innerHTML =
          '<div class="modal" role="dialog" aria-modal="true" aria-label="Connect to the NAS">' +
          '<h4>Connect to the club storage</h4><div class="mbody">' +
          (d.error ? '<div class="err"></div>' : '') +
          '<label>Address<input type="text" id="c-host" placeholder="https://nas.local:5001" value="' +
          (d.host || '') +
          '"></label>' +
          '<label>User<input type="text" id="c-user" value="' +
          (d.user || '') +
          '"></label>' +
          '<label>Password<input type="password" id="c-pass"></label>' +
          '<span class="meta">Entered once. The session renews itself from the stored password, which is kept encrypted — the plain one is never written down.</span>' +
          '</div><div class="mfoot"><span class="spacer"></span>' +
          '<button class="mini" data-x>Cancel</button><button class="go" data-ok>Connect</button></div></div>'
        if (d.error) back.querySelector('.err').textContent = d.error
        const go = () => {
          const host = back.querySelector('#c-host').value
          const user = back.querySelector('#c-user').value
          const pass = back.querySelector('#c-pass').value
          const err = nasConnect(host, user, pass)
          if (err) {
            state.dialog = { kind: 'connect', error: err, host, user }
            render()
          }
        }
        back.querySelector('[data-ok]').addEventListener('click', go)
        back.querySelector('[data-x]').addEventListener('click', close)
        back.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault()
            go()
          }
          if (e.key === 'Escape') {
            e.preventDefault()
            close()
          }
        })
        document.body.appendChild(back)
        back.querySelector('#c-host').focus()
        return
      }

      if (d.kind === 'deliver') {
        const j = jumps.find((x) => x.id === d.id)
        if (!j) {
          state.dialog = null
          return
        }
        const who = j.passenger
        const vids = j.files.filter((f) => f.kind === 'video')
        const pics = j.files.filter((f) => f.kind === 'photo')
        /* One config for the whole club, not a decision per passenger: what you set here is what the
         next tandem opens with, until you change it again. */
        const opt = state.parcel
        const shareDir = state.nas.shareFolder || null
        const backDir = state.nas.backupFolder || null
        const zipOf = (list) => Math.round(list.reduce((n2, f) => n2 + f.size, 0) * 0.98)
        /* one backup folder for every tandem, so the archive carries who and when in its name */
        const backName = slug(who) + '_' + dayStamp(minT(j))
        const backSize = zipOf(vids) + (opt.filmToBackup ? (j.film ? j.film.size : 0) : 0)

        /* two parcels, and the whole question is what belongs in each */
        const parcel = (title, where, target, note, items) =>
          '<div class="parcel"><div class="ph"><b>' +
          title +
          '</b><span class="arrow">→</span>' +
          '<button class="mini" data-pick="' +
          target +
          '">' +
          (where || 'choose a folder') +
          '</button>' +
          (where
            ? '<span class="kept" title="Remembered from last time — click the folder to change it">kept</span>'
            : '') +
          '<span class="meta ptag">' +
          note +
          '</span></div><div class="pitems">' +
          items +
          '</div></div>'
        const item = (on, name, sz, what, key) =>
          '<label class="pitem' +
          (on ? '' : ' off') +
          '">' +
          (key
            ? '<input type="checkbox" data-opt="' + key + '"' + (on ? ' checked' : '') + '>'
            : '<span class="fixed">•</span>') +
          '<code>' +
          name +
          '</code><span class="meta">' +
          sz +
          '</span><span class="meta what">' +
          what +
          '</span></label>'

        /* Two parcels, and what separates them is not zipping versus sending — it is what each one
         waits for. The originals are ready the moment the tandem is processed, so the backup can go
         while the edit is still open. The passenger's parcel cannot exist until the film does. */
        const zipMode = opt.backupAs === 'zip'
        back.innerHTML =
          '<div class="modal wide" role="dialog" aria-modal="true" aria-label="Upload">' +
          '<h4>' +
          who +
          '</h4><div class="mbody">' +
          parcel(
            'Backup',
            backDir,
            'backup',
            j.backedUp
              ? '<span class="done">✓ archived ' +
                  hhmm(Math.floor(j.backedUp.at / 1000)) +
                  '</span>'
              : 'ready now · never shared',
            (zipMode
              ? item(
                  true,
                  backName + '.zip',
                  size(backSize),
                  plural(vids.length, 'original video') + (opt.filmToBackup ? ' + the film' : ''),
                  null
                )
              : item(
                  true,
                  backName + '/',
                  size(backSize),
                  plural(vids.length, 'original video') +
                    (opt.filmToBackup ? ' + the film' : '') +
                    ', as files',
                  null
                )) +
              (j.film
                ? item(
                    opt.filmToBackup,
                    '…' + (zipMode ? ' inside that zip' : ' in that folder'),
                    size(j.film.size),
                    'a copy of the film',
                    'filmToBackup'
                  )
                : '')
          ) +
          parcel(
            'For ' + who,
            shareDir ? shareDir + '/' + who : null,
            'share',
            j.sent
              ? '<span class="done">✓ uploaded ' + hhmm(Math.floor(j.sent.at / 1000)) + '</span>'
              : j.film
                ? 'ready to upload'
                : 'waiting for the film',
            (j.film
              ? item(true, j.film.name, size(j.film.size), 'the film', null)
              : '<div class="pitem off"><span class="fixed">•</span><code>no film yet</code>' +
                '<span class="meta what">render it in kdenlive first</span></div>') +
              item(
                true,
                slug(who) + '.photos.zip',
                size(zipOf(pics)),
                plural(pics.length, 'photo'),
                null
              )
          ) +
          '<div class="switchrow"><span>Keep the backup as</span>' +
          '<span class="seg" role="group"><button data-as="zip" aria-pressed="' +
          (zipMode ? 'true' : 'false') +
          '">One zip</button>' +
          '<button data-as="folder" aria-pressed="' +
          (zipMode ? 'false' : 'true') +
          '">Plain files</button></span>' +
          '<span class="meta">' +
          (zipMode
            ? 'one object to move, and it cannot arrive half-copied'
            : 'browsable on the NAS, and one clip can be pulled out without unpacking it all') +
          '</span></div>' +
          '<p class="meta explore"><b>Set once, reused after that.</b> Both folders and the choices above are ' +
          'remembered, so the next tandem opens with this already filled in — until you change it again. ' +
          'The archive is only built once, too: press again after a re-render and it is reused unless something ' +
          'in it changed. The project and the working folders never leave this machine. ' +
          'Handing the folder to the passenger is a later step.</p>' +
          '</div><div class="mfoot"><span class="meta" data-tot></span><span class="spacer"></span>' +
          '<button class="mini" data-x>Close</button>' +
          '<button class="go" data-ok>' +
          (!j.film ? 'Back up originals' : j.sent ? 'Upload again' : 'Upload') +
          '</button></div></div>'

        const toPax = (j.film ? j.film.size : 0) + zipOf(pics)
        back.querySelector('[data-tot]').textContent =
          size(backSize) + ' to the backup · ' + size(toPax) + ' to ' + who
        back.querySelectorAll('[data-opt]').forEach((cb) =>
          cb.addEventListener('change', () => {
            opt[cb.dataset.opt] = cb.checked
            state.dialog = { ...d }
            render()
          })
        )
        back.querySelectorAll('[data-as]').forEach((b2) =>
          b2.addEventListener('click', () => {
            opt.backupAs = b2.dataset.as
            state.dialog = { ...d }
            render()
          })
        )

        back.querySelectorAll('[data-pick]').forEach((b2) =>
          b2.addEventListener('click', () => {
            state.dialog = {
              kind: 'folder',
              target: b2.dataset.pick,
              path: (b2.dataset.pick === 'share' ? shareDir : backDir) || '/',
              back: d
            }
            render()
          })
        )
        back.querySelector('[data-x]').addEventListener('click', close)

        /* One press does both parcels. They still go at different moments when you want them to — the
         card offers the backup on its own while the edit is open — but nobody should have to press
         two buttons to put one tandem away. */
        const runBackup = () => {
          if (!vids.length) return { skipped: true }
          if (!backDir) return { error: 'Choose the backup folder first — it is never guessed.' }
          const same = j.backedUp && j.backedUp.size === backSize && j.backedUp.as === opt.backupAs
          if (same) return { reused: true }
          if (opt.backupAs === 'zip') {
            nasFiles.set(backDir + '/' + backName + '.zip', { size: backSize, sum: 'bz' + j.id })
          } else {
            const dir = backDir + '/' + backName
            NAS_TREE[backDir] = (NAS_TREE[backDir] || []).filter((x) => x !== dir).concat(dir)
            NAS_TREE[dir] = []
            vids.forEach((f) =>
              nasFiles.set(dir + '/' + nameOf(f), { size: f.size, sum: sumOf(f) })
            )
            if (opt.filmToBackup && j.film)
              nasFiles.set(dir + '/' + j.film.name, { size: j.film.size, sum: 'film' + j.id })
          }
          j.backedUp = { at: Date.now(), size: backSize, as: opt.backupAs, where: backDir }
          return { done: true }
        }

        /* the passenger's folder holds exactly two things, and one of them has to be rendered first */
        back.querySelector('[data-ok]').addEventListener('click', () => {
          const bk = runBackup()
          if (bk.error) {
            toast(bk.error)
            return
          }

          if (!j.film) {
            state.dialog = { ...d }
            render()
            toast(
              bk.reused
                ? 'Nothing in the archive changed — the ' +
                    size(backSize) +
                    ' already there is reused.'
                : 'Originals archived to ' +
                    backDir +
                    ' as ' +
                    (opt.backupAs === 'zip'
                      ? 'one zip, ' + size(backSize)
                      : plural(vids.length, 'file') + ' in a folder') +
                    '. The edit can carry on.'
            )
            return
          }

          if (!shareDir) {
            toast('Choose where ' + who + "'s folder goes first.")
            return
          }
          if (state.upload) {
            toast('One upload at a time — this one is still going.')
            return
          }
          const paxDir = shareDir + '/' + who
          NAS_TREE[shareDir] = (NAS_TREE[shareDir] || []).filter((x) => x !== paxDir).concat(paxDir)
          NAS_TREE[paxDir] = NAS_TREE[paxDir] || []

          /* the dialog gets out of the way; the strip on the card carries on where it left off */
          state.dialog = null
          const parcels = [
            {
              name: j.film.name,
              put: () =>
                nasFiles.set(paxDir + '/' + j.film.name, { size: j.film.size, sum: 'film' + j.id })
            },
            {
              name: slug(who) + '.photos.zip',
              put: () =>
                nasFiles.set(paxDir + '/' + slug(who) + '.photos.zip', {
                  size: zipOf(pics),
                  sum: 'pz' + j.id
                })
            }
          ]
          if (!bk.reused && !bk.skipped)
            parcels.push({
              name: backName + (opt.backupAs === 'zip' ? '.zip' : '/') + '  → backup',
              put: () => {}
            })
          runUpload(
            'pax:' + who,
            who,
            parcels,
            (it) => it.put(),
            () => {
              j.sent = {
                at: Date.now(),
                dir: paxDir,
                share: 'https://nas.local/d/' + slug(who) + '-' + j.id.slice(-4)
              }
              /* The tandem's own files are on the NAS now — inside the archives SkyDock built from exactly
             these bytes. That is the same proof an upload has, so they read uploaded and lock like any
             other uploaded file. It also closes the hole where a delivered tandem still offered 515
             editable rows. */
              const photosZip = slug(who) + '.photos.zip'
              const rushes = backName + (opt.backupAs === 'zip' ? '.zip' : '')
              pics.forEach((f) => {
                f.status = 'uploaded'
                delete f.stale
                f.inArchive = photosZip
              })
              vids.forEach((f) => {
                f.status = 'uploaded'
                delete f.stale
                /* kept as plain files, the originals are findable on the NAS on their own */
                if (opt.backupAs === 'zip') f.inArchive = rushes
                else delete f.inArchive
              })
              j.folded = true
              render()
              toast(
                'Uploaded · ' +
                  paxDir +
                  ' holds the film and the photos, nothing else · ' +
                  (bk.reused
                    ? 'the archive was already there'
                    : bk.skipped
                      ? 'no originals to archive'
                      : 'originals archived to ' + backDir) +
                  '. Every file is on the NAS now, so the tandem is closed to changes.'
              )
            }
          )
        })

        back.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            e.preventDefault()
            close()
          }
        })
        document.body.appendChild(back)
        return
      }

      /* the folder browser: directories only, because a folder is what you are choosing */
      const path = d.path || '/'
      const title = d.destination
        ? 'NAS folder for ' + d.destination
        : d.target === 'backup'
          ? 'Where the originals are archived'
          : d.target === 'share'
            ? "Where passengers' folders are made"
            : 'Default NAS folder'
      back.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="' +
        title +
        '">' +
        '<h4>' +
        title +
        '</h4><div class="mbody">' +
        '<div class="crumbs"></div><div class="folders"></div>' +
        '<span class="meta">Click to choose, double-click to open. Nothing is guessed: a dropzone with no folder is asked for one rather than filed somewhere sensible-looking.</span>' +
        '</div><div class="mfoot"><button class="mini" data-new>+ New folder</button><span class="spacer"></span>' +
        '<button class="mini" data-x>Cancel</button><button class="go" data-ok>Use this folder</button></div></div>'

      const crumbs = back.querySelector('.crumbs')
      const parts = path === '/' ? [] : path.split('/').filter(Boolean)
      const rootBtn = document.createElement('button')
      rootBtn.type = 'button'
      rootBtn.textContent = 'Shares'
      rootBtn.addEventListener('click', () => {
        state.dialog = { ...d, path: '/' }
        render()
      })
      crumbs.appendChild(rootBtn)
      parts.forEach((part, i) => {
        crumbs.insertAdjacentText('beforeend', ' / ')
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = part
        const to = '/' + parts.slice(0, i + 1).join('/')
        b.addEventListener('click', () => {
          state.dialog = { ...d, path: to }
          render()
        })
        crumbs.appendChild(b)
      })

      const list = back.querySelector('.folders')
      const kids = NAS_TREE[path] || []
      if (!kids.length)
        list.innerHTML =
          '<div class="empty2">No folders in here. Make one, or use this folder as it is.</div>'
      kids.forEach((full) => {
        const b = document.createElement('button')
        b.type = 'button'
        b.setAttribute('aria-selected', full === d.selected ? 'true' : 'false')
        b.innerHTML = '<span aria-hidden="true">▸</span><span></span>'
        b.querySelectorAll('span')[1].textContent = full.split('/').pop()
        b.addEventListener('click', () => {
          state.dialog = { ...d, selected: full }
          render()
        })
        b.addEventListener('dblclick', () => {
          state.dialog = { ...d, path: full, selected: full }
          render()
        })
        list.appendChild(b)
      })

      back.querySelector('[data-new]').addEventListener('click', () => {
        const name = window.prompt ? null : null
        /* no window.prompt anywhere: the new folder is named inline */
        const row = document.createElement('div')
        row.style.cssText = 'display:flex;gap:6px'
        row.innerHTML =
          '<input type="text" placeholder="Folder name" style="flex:1">' +
          '<button class="mini" data-make>Create</button>'
        back.querySelector('.mbody').appendChild(row)
        const input = row.querySelector('input')
        input.focus()
        const make = () => {
          const v = input.value.trim()
          if (!v || v.includes('/')) {
            toast('A folder name cannot be empty or contain a slash.')
            return
          }
          const full = (path === '/' ? '' : path) + '/' + v
          NAS_TREE[path] = (NAS_TREE[path] || []).concat(full)
          NAS_TREE[full] = []
          state.dialog = { ...d, path, selected: full }
          render()
          toast('Created ' + full + ' on the NAS.')
        }
        row.querySelector('[data-make]').addEventListener('click', make)
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault()
            make()
          }
        })
        void name
      })
      back.querySelector('[data-x]').addEventListener('click', close)
      back.querySelector('[data-ok]').addEventListener('click', () => {
        const chosen = d.selected || (path === '/' ? null : path)
        if (!chosen) {
          toast('Pick a folder first.')
          return
        }
        if (d.destination) dz(d.destination).path = chosen
        else if (d.target === 'backup') state.nas.backupFolder = chosen
        else if (d.target === 'share') state.nas.shareFolder = chosen
        else state.nas.defaultFolder = chosen
        /* a folder chosen from the delivery panel goes straight back to it */
        state.dialog = d.back || null
        render()
        toast(
          (d.destination
            ? d.destination + ' goes to '
            : d.target === 'backup'
              ? 'Originals are archived to '
              : d.target === 'share'
                ? "Passengers' folders are made in "
                : 'The default folder is ') +
            chosen +
            '.'
        )
      })
      back.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault()
          close()
        }
      })
      document.body.appendChild(back)
    }

    /* ------------------------------------------------------------ network storage UI */
    const renderNasBar = () => {
      const el = document.getElementById('nasbar')
      el.textContent = ''
      const chip = document.createElement('span')
      chip.className = 'nas' + (state.nas.connected ? ' on' : '')
      chip.innerHTML = '<span class="led" aria-hidden="true"></span><span class="what"></span>'
      const what = chip.querySelector('.what')
      if (state.nas.connected) {
        what.innerHTML = '<b></b>'
        what.querySelector('b').textContent = state.nas.host
        const sep = document.createElement('span')
        sep.className = 'sep'
        sep.textContent = '·'
        chip.appendChild(sep)
        const out = document.createElement('button')
        out.className = 'link'
        out.type = 'button'
        out.textContent = 'disconnect'
        out.addEventListener('click', nasDisconnect)
        chip.appendChild(out)
      } else {
        what.textContent = 'NAS offline'
        const sep = document.createElement('span')
        sep.className = 'sep'
        sep.textContent = '·'
        chip.appendChild(sep)
        const go = document.createElement('button')
        go.className = 'link'
        go.type = 'button'
        go.textContent = 'connect'
        go.addEventListener('click', () => {
          state.dialog = { kind: 'connect' }
          render()
        })
        chip.appendChild(go)
      }
      el.appendChild(chip)
    }

    /* A dropzone's own line about the NAS: which folder it goes to, and what a comparison last found. */
    const renderNasline = () => {
      const el = document.getElementById('nasline')
      const n = state.node
      if (n.kind !== 'dz') {
        el.hidden = true
        el.textContent = ''
        return
      }
      el.hidden = false
      el.textContent = ''

      const ck = state.nas.checking
      if (ck && ck.destination === n.name) {
        const box = document.createElement('span')
        box.className = 'checking'
        box.innerHTML =
          '<span>Comparing with the NAS…</span><span class="bar"><i></i></span><span class="meta"></span>'
        box.querySelector('i').style.width = Math.round((ck.done / ck.total) * 100) + '%'
        box.querySelector('.meta').textContent = ck.done + ' / ' + ck.total + ' · ' + ck.name
        el.appendChild(box)
        return
      }

      const folder = nasFolderFor(n.name)
      const lead = document.createElement('span')
      lead.innerHTML = folder
        ? 'Goes to <code></code>'
        : '<span>No NAS folder chosen for ' + n.name + ' yet.</span>'
      if (folder) lead.querySelector('code').textContent = folder
      el.appendChild(lead)

      const pick = document.createElement('button')
      pick.className = 'mini'
      pick.type = 'button'
      pick.textContent = folder ? 'Change folder' : 'Choose a folder'
      pick.addEventListener('click', () => {
        if (!state.nas.connected) {
          state.dialog = { kind: 'connect' }
          render()
          return
        }
        state.dialog = {
          kind: 'folder',
          destination: n.name,
          path: folder || state.nas.defaultFolder || '/'
        }
        render()
      })
      el.appendChild(pick)

      const right = document.createElement('span')
      right.className = 'right'
      const files = allFiles(jumps.filter((j) => j.dest === n.name))
      const up = files.filter((f) => f.status === 'uploaded').length
      const ready = files.filter((f) => f.status === 'processed').length
      const note = document.createElement('span')
      note.className = 'meta'
      note.textContent =
        up +
        ' on the NAS · ' +
        ready +
        ' prepared, not sent yet' +
        (state.nas.checkedAt ? ' · checked ' + hhmm(Math.floor(state.nas.checkedAt / 1000)) : '')
      right.appendChild(note)
      const chk = document.createElement('button')
      chk.className = 'mini'
      chk.type = 'button'
      chk.textContent = '⟳ Check the NAS'
      chk.title =
        'Compare every prepared file here against the NAS, byte for byte. SkyDock only ever adds to the NAS — removing anything is done over there, and this is how it finds out.'
      chk.addEventListener('click', () => checkDropzone(n.name))
      right.appendChild(chk)
      el.appendChild(right)
    }

    /* The one line in the whole app that talks about naming — a sample, not a pattern editor. */
    const renderSaveline = () => {
      const n = state.node
      const el = document.getElementById('saveline')
      el.textContent = ''
      if (n.kind === 'sort') {
        el.innerHTML =
          '<span>Nothing here is renamed or copied yet — sorting only moves files between jumps.</span>'
        return
      }
      if (n.kind === 'tandems') {
        el.innerHTML =
          '<span>Each passenger gets a folder of their own. Files dropped here wait for a name first.</span>'
        return
      }
      if (n.kind === 'dz') {
        const d = dz(n.name)
        const sample = jumps
          .filter((j) => j.dest === n.name)
          .map((j) => j.files[0])
          .filter(Boolean)[0]
        const shown = sample
          ? outputName(sample)
          : d.keepNames
            ? 'GX010023.MP4'
            : slug(n.name) + '_20260801_093015.mp4'
        el.innerHTML =
          '<span>Saved into <code>' +
          n.name +
          '/</code> as <code>' +
          shown +
          '</code></span>' +
          '<label><input type="checkbox" id="keep"' +
          (d.keepNames ? ' checked' : '') +
          "> Keep the camera's own names</label>"
        el.querySelector('#keep').addEventListener('change', (e) => {
          d.keepNames = e.target.checked
          render()
          toast(
            d.keepNames
              ? 'Keeping the camera names for ' +
                  n.name +
                  '. Two cameras can then produce the same name — SkyDock adds a number rather than overwriting.'
              : 'Renaming by place and time for ' +
                  n.name +
                  '. Sorted by name is sorted by time, on any computer.'
          )
        })
        return
      }
      if (n.kind === 'pax') {
        const j = namedTandems().find((x) => x.passenger === n.name)
        const s = j ? slug(n.name) : 'luc_favre'
        el.innerHTML =
          '<span>The passenger gets a folder called <code>' +
          n.name +
          '</code> holding <code>' +
          s +
          '.mp4</code> and their photos.</span>' +
          '<span class="meta" style="margin-left:auto">The originals go to the backup folder, never to them.</span>'
      }
    }

    /* ----------------------------------------------------------------- pane */
    const renderPane = () => {
      const n = state.node
      const s = document.getElementById('scroll')
      s.textContent = ''
      laneIds = []

      /* Unsorted jumps and dropzones share one layout: days that fold open, hours that fold, same buttons
       in the same places. Sorting only adds its own hour actions (split, merge, re-apply the rule). */
      if (n.kind === 'dz' || n.kind === 'sort') {
        const isSort = n.kind === 'sort'
        const ok = isSort ? '__sort' : n.name
        const list = isSort ? sortingJumps() : jumpsIn(n)
        if (!list.length) {
          s.innerHTML = isSort
            ? '<div class="empty">Everything is filed. Nice day.</div>'
            : '<div class="empty">Nothing filed here yet. Drag a jump onto ' +
              n.name +
              ' in the tree.</div>'
          return
        }
        const byDay = new Map()
        list.forEach((j) => {
          const k = dayKey(minT(j))
          if (!byDay.has(k)) byDay.set(k, [])
          byDay.get(k).push(j)
        })
        const keys = Array.from(byDay.keys()).sort().reverse()
        const stageOf = (files) =>
          files.every((f) => f.status === 'uploaded')
            ? 'done'
            : files.every((f) => f.status !== 'local')
              ? 'send'
              : 'prepare'
        const looseKey = (k) => 'loose-' + k

        /* one day open at a time; by default the newest day that still has work to do */
        let open = state.openDay.get(ok)
        /* null = every day closed on purpose; only an unknown or vanished day falls back to the default */
        if (open !== null && !byDay.has(open)) {
          open = keys.find((k) => stageOf(allFiles(byDay.get(k))) !== 'done') || keys[0]
          state.openDay.set(ok, open)
        }

        const wrap = document.createElement('div')
        wrap.className = 'days'
        const bar = document.createElement('div')
        bar.className = 'daysbar'
        const allHourIds = open ? byDay.get(open).map((j) => (j.loose ? looseKey(open) : j.id)) : []
        const anyShut = allHourIds.some((id) => state.shutHours.has(id))
        bar.innerHTML = '<span class="meta"></span>'
        bar.querySelector('.meta').textContent =
          plural(keys.length, 'day') + (open ? ' · ' + dayLabel(open) + ' open' : ' · all closed')
        const barBtn = (label, title, fn, off) => {
          const b = document.createElement('button')
          b.className = 'mini'
          b.type = 'button'
          b.textContent = label
          b.title = title
          b.disabled = !!off
          b.addEventListener('click', fn)
          bar.appendChild(b)
        }
        /* hours exist only where jumps do — a dropzone day is one flat run and has none to fold */
        if (isSort) {
          barBtn(
            'Collapse jumps',
            'Fold every jump of the open day down to its name',
            () => {
              allHourIds.forEach((id) => state.shutHours.add(id))
              render()
            },
            !open || allHourIds.every((id) => state.shutHours.has(id))
          )
          barBtn(
            'Expand jumps',
            'Show the files of every jump of the open day',
            () => {
              allHourIds.forEach((id) => state.shutHours.delete(id))
              render()
            },
            !open || !anyShut
          )
        }
        barBtn(
          'Close all days',
          'Fold every day down to one line',
          () => {
            state.openDay.set(ok, null)
            render()
            document.getElementById('scroll').scrollTop = 0
          },
          !open
        )
        if (isSort) {
          /* re-run the grouping on demand: same rule as a camera scan, hand-edited (locked) jumps are kept */
          const lockedN = list.filter((j) => j.locked).length
          bar.querySelector('.meta').textContent =
            plural(list.length, 'jump') +
            (lockedN ? ' · ' + lockedN + ' locked' : '') +
            ' · ' +
            (open ? dayLabel(open) + ' open' : 'all closed')
          barBtn(
            'Regroup',
            'Run the 30-minute rule again on every unlocked jump here — locked jumps stay as you set them',
            regroup
          )
          const note = document.createElement('p')
          note.className = 'note'
          note.style.margin = '8px 0 0'
          note.innerHTML =
            '<b>Files 30 minutes or more apart start a new jump.</b> Correct one by hand — split, merge, ' +
            'retime — and it locks, so Regroup and the next scan leave it exactly as you set it. ' +
            'Files you drop on a day, or on Unsorted jumps itself, stay <b>loose</b>: outside any jump until you say otherwise, ' +
            'and the rule never gathers them back up.'
          s.appendChild(note)
        }
        wrap.appendChild(bar)

        keys.forEach((k) => {
          const all = byDay.get(k)
          const dayJumps = all.filter((j) => !j.loose).sort((a, b) => minT(a) - minT(b))
          const loose = all.find((j) => j.loose)
          const files = allFiles(all)
          const stage = stageOf(files)
          const isOpen = k === open

          const row = document.createElement('div')
          row.className = 'dayrow' + (isOpen ? ' open' : '')
          const head = document.createElement('div')
          head.className = 'dayrow-head'
          head.innerHTML =
            '<button class="dayrow-toggle" type="button"><span class="chev" aria-hidden="true">▸</span>' +
            '<h3></h3><span class="meta"></span></button><span class="kindslot"></span>' +
            '<span class="hours"></span><span class="acts"></span>'
          const toggle = head.querySelector('.dayrow-toggle')
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false')
          head.querySelector('h3').textContent = dayLabel(k)
          head.querySelector('.meta').textContent = plural(files.length, 'file')
          /* only where there is a choice to make: a day of nothing but photos needs no filter */
          if (
            isOpen &&
            files.some((f) => f.kind === 'video') &&
            files.some((f) => f.kind === 'photo')
          ) {
            head.querySelector('.kindslot').appendChild(kindBadges(files, true))
          }

          const openDay = (anchorKey) => {
            state.openDay.set(ok, k)
            if (anchorKey) state.shutHours.delete(anchorKey)
            render()
            scrollToAnchor(anchorKey ? 'at-' + anchorKey : 'day-' + k)
          }
          toggle.addEventListener('click', () => {
            if (isOpen) {
              state.openDay.set(ok, null)
              render()
            } else openDay()
          })
          /* the whole bar opens and closes the day; only its buttons do something else */
          head.addEventListener('click', (e) => {
            if (e.target.closest('button, input, a, .timeedit') || e.target === toggle) return
            toggle.click()
          })
          /* the hours of a day, as chips: one click lands on that hour, even from a closed day.
           A dropzone has no hours to land on — its day is one flat run of files — so it shows none. */
          const hours = head.querySelector('.hours')
          if (isSort && loose) {
            const c = document.createElement('button')
            c.type = 'button'
            c.className = 'loosechip'
            c.title = 'Loose files — in this day, not in any jump yet'
            c.innerHTML = '<b>◌ loose</b><span></span>'
            c.querySelector('span').textContent = loose.files.length
            c.addEventListener('click', () => openDay(looseKey(k)))
            dropOn(c, { kind: 'loose', name: n.name, day: k })
            hours.appendChild(c)
          }
          if (isSort)
            dayJumps.forEach((j, ji) => {
              const c = document.createElement('button')
              c.type = 'button'
              c.title = 'Go to Jump ' + (ji + 1) + ' · ' + hhmm(minT(j)) + '–' + hhmm(maxT(j))
              c.innerHTML = '<b></b><span></span>'
              c.querySelector('b').textContent = 'Jump ' + (ji + 1)
              c.querySelector('span').textContent = j.files.length
              c.addEventListener('click', () => openDay(j.id))
              dropOn(c, { kind: 'jump', id: j.id })
              hours.appendChild(c)
            })

          const acts = head.querySelector('.acts')
          if (isOpen) {
            const pick = document.createElement('button')
            const dayVis = files.filter(matches)
            const dayAll = dayVis.length > 0 && dayVis.every((f) => state.picked.has(f.id))
            pick.className = 'mini'
            pick.type = 'button'
            pick.textContent = dayAll ? 'Unselect day' : 'Select day'
            pick.addEventListener('click', () => {
              const vis = files.filter(matches)
              const every = vis.every((f) => state.picked.has(f.id))
              vis.forEach((f) => (every ? state.picked.delete(f.id) : state.picked.add(f.id)))
              render()
            })
            acts.appendChild(pick)

            /* Correcting a wrong camera clock for a whole batch: the day's line offers it as soon as
             anything is picked, prefilled with the earliest one's time. Everything picked moves by
             the same difference, so the files keep their spacing. Same in both places. */
            {
              const sel = filesByIds(state.picked)
              if (sel.length) {
                const spanDays = new Set(sel.map((f) => dayKey(f.t))).size
                const setT = document.createElement('button')
                setT.className = 'mini'
                setT.type = 'button'
                setT.textContent = 'Set time · ' + plural(sel.length, 'file')
                setT.title =
                  'Move the ' +
                  plural(sel.length, 'selected file') +
                  " by one difference, from the earliest one's time" +
                  (spanDays > 1 ? ' — across ' + spanDays + ' days' : '')
                setT.addEventListener('click', (e) => {
                  e.stopPropagation()
                  editFileTime(setT, sel, null)
                })
                acts.appendChild(setT)
              }
            }
          }
          if (isSort) {
            /* nothing to prepare or send while a jump is still unsorted */
          } else if (stage === 'done') {
            const d = document.createElement('span')
            d.className = 'done'
            d.textContent = '✓ sent'
            acts.appendChild(d)
          } else {
            const go = document.createElement('button')
            go.className = 'go'
            go.type = 'button'
            go.textContent = stage === 'prepare' ? 'Prepare' : 'Send to the club'
            go.title =
              stage === 'prepare'
                ? 'Copy, rename, crop and date this day into ' + n.name + '/'
                : 'Upload to the club storage, skipping what is already there'
            go.addEventListener('click', () => advance(all, n.name + '/', n.name))
            acts.appendChild(go)
          }
          row.id = 'day-' + k
          /* Inside the bar, not under it: the bar is sticky, so anything in normal flow beneath it is
           painted over the moment you scroll. In the header it stays with the button that started it. */
          if (isOpen) {
            const us = uploadStrip('dz:' + n.name)
            if (us) head.appendChild(us)
          }
          row.appendChild(head)

          if (isOpen) {
            const body = document.createElement('div')
            body.className = 'dayrow-body'
            const foldBtn = (key, shut, r) => {
              const chev = document.createElement('button')
              chev.type = 'button'
              chev.className = 'hchev'
              chev.textContent = '▸'
              chev.setAttribute('aria-expanded', shut ? 'false' : 'true')
              chev.title = shut ? 'Show these files' : 'Fold'
              chev.addEventListener('click', () => {
                if (shut) state.shutHours.delete(key)
                else state.shutHours.add(key)
                render()
              })
              r.appendChild(chev)
              /* same for an hour line: anywhere that isn't a button folds or unfolds it */
              r.addEventListener('click', (e) => {
                if (e.target.closest('button, input, .timeedit')) return
                chev.click()
              })
            }
            /* same discreet button as "Select day": takes every file of that hour (drawn or folded), again to let go */
            const pickBtn = (files, r, noun) => {
              noun = noun || 'jump'
              const vis = files.filter(matches)
              const every = vis.length > 0 && vis.every((f) => state.picked.has(f.id))
              const b = document.createElement('button')
              b.type = 'button'
              b.className = 'mini hpick'
              b.textContent = (every ? 'Unselect ' : 'Select ') + noun
              b.title =
                (every ? 'Unselect' : 'Select') +
                ' the ' +
                plural(vis.length, 'file') +
                ' of this ' +
                noun
              b.addEventListener('click', () => {
                vis.forEach((f) => (every ? state.picked.delete(f.id) : state.picked.add(f.id)))
                render()
              })
              return b
            }

            /* A dropzone day is one run of files, because that is exactly how it lands on disk.
             No hour sections to read past, and each file's own time is what names it. */
            if (!isSort) {
              filesInto(body, files, k, null, true)
              row.appendChild(body)
              dropOn(row, { kind: 'loose', name: n.name, day: k })
              wrap.appendChild(row)
              return
            }

            /* Loose files: dropped on the day, not on an hour. They wait here, outside any jump, until
             you drag them onto an hour or gather them into a jump of their own — nothing is guessed. */
            if (loose) {
              const key = looseKey(k)
              const at = document.createElement('div')
              at.id = 'at-' + key
              body.appendChild(at)
              const r = document.createElement('div')
              r.className = 'rule loose'
              r.title = 'Drop files here to keep them loose in this day'
              dropOn(r, { kind: 'loose', name: n.name, day: k })
              const shut = state.shutHours.has(key)
              if (shut) r.classList.add('shut')
              foldBtn(key, shut, r)
              r.insertAdjacentHTML('beforeend', '<b>◌ Loose files</b>')
              r.append(' ' + plural(loose.files.length, 'file') + ' · not in a jump yet')
              const pickedLoose = loose.files.filter((f) => state.picked.has(f.id))
              const mk = document.createElement('button')
              mk.type = 'button'
              mk.className = 'mini'
              mk.textContent = pickedLoose.length
                ? 'Make a jump of ' + plural(pickedLoose.length, 'picked file')
                : 'Make a jump of all ' + loose.files.length
              mk.title = 'Gather these files into a jump of their own'
              mk.addEventListener('click', () => {
                const take = pickedLoose.length ? pickedLoose : loose.files.slice()
                const ids = new Set(take.map((f) => f.id))
                loose.files = loose.files.filter((f) => !ids.has(f.id))
                const nj = mkJump(
                  take.sort((a, b) => a.t - b.t),
                  n.name
                )
                jumps.push(nj)
                jumps = jumps.filter((j) => j.files.length > 0).sort((a, b) => minT(a) - minT(b))
                take.forEach((f) => state.picked.delete(f.id))
                render()
                scrollToAnchor('at-' + nj.id)
                toast('New jump at ' + hhmm(minT(nj)) + ' · ' + plural(take.length, 'file') + '.')
              })
              r.appendChild(mk)
              r.appendChild(pickBtn(loose.files, r, 'loose'))
              body.appendChild(r)
              if (!shut) filesInto(body, loose.files, key, null, true)
            }

            dayJumps.forEach((j) => {
              const r = document.createElement('div')
              const at = document.createElement('div')
              at.id = 'at-' + j.id
              body.appendChild(at)
              r.className = 'rule'
              r.id = 'hour-' + j.id
              r.title = 'Drop files here to add them to this jump'
              dropOn(r, { kind: 'jump', id: j.id })
              const shut = state.shutHours.has(j.id)
              if (shut) r.classList.add('shut')
              foldBtn(j.id, shut, r)
              /* A name, not a time heading. "Jump 2" says why these files are together — they were
               almost certainly shot on the same jump — where a bare 08:40 only said when. The range
               sits next to it so the guess stays checkable. */
              const nameEl = document.createElement('b')
              nameEl.className = 'jname'
              nameEl.textContent = 'Jump ' + (dayJumps.indexOf(j) + 1)
              r.appendChild(nameEl)
              const clk = document.createElement('button')
              clk.type = 'button'
              clk.className = 'clock edit'
              clk.title = 'Correct the start — every file of this jump shifts with it'
              clk.textContent = hhmmss(minT(j))
              clk.addEventListener('click', () => editTime(clk, j))
              r.appendChild(clk)
              r.insertAdjacentHTML(
                'beforeend',
                '<span class="jspan">–' + hhmmss(maxT(j)) + '</span>'
              )
              r.append(' ' + plural(j.files.length, 'file'))
              if (isSort) {
                if (j.locked)
                  r.insertAdjacentHTML(
                    'beforeend',
                    '<span class="lock" title="Edited by hand — Regroup and rescans leave it alone">◆ locked</span>'
                  )
                /* drag the hour line itself to file the whole jump in a dropzone or tandem */
                r.draggable = true
                r.title =
                  'Drag this line onto a dropzone or Tandems to file the whole jump · drop files here to add them'
                r.addEventListener('dragstart', (e) => {
                  if (e.target !== r) return
                  state.dragging = { type: 'jumps', ids: new Set([j.id]) }
                  e.dataTransfer.effectAllowed = 'move'
                  e.dataTransfer.setData('text/plain', 'jump')
                })
                r.addEventListener('dragend', () => {
                  state.dragging = null
                })
                const hourBtn = (label, title, fn, off) => {
                  const b = document.createElement('button')
                  b.type = 'button'
                  b.className = 'mini'
                  b.textContent = label
                  b.title = title
                  b.disabled = !!off
                  b.addEventListener('click', fn)
                  r.appendChild(b)
                }
                const pickedHere = j.files.filter((f) => state.picked.has(f.id)).length
                const idx = dayJumps.indexOf(j)
                hourBtn(
                  'Split',
                  pickedHere && pickedHere < j.files.length
                    ? 'Move the ' +
                        plural(pickedHere, 'selected file') +
                        ' into a jump of their own'
                    : "Select some of this jump's files first",
                  () => splitJump(j.id),
                  !(pickedHere && pickedHere < j.files.length)
                )
                hourBtn(
                  'Merge up',
                  idx === 0 ? 'Nothing above on this day' : 'Join the jump above',
                  () => mergeUp(j.id),
                  idx === 0
                )
                hourBtn(
                  'Ungroup',
                  'Break this jump up — its files stay in the day, in no jump',
                  () => ungroupJump(j.id)
                )
                if (j.locked)
                  hourBtn('Re-apply rule', 'Unlock — let the 30-minute rule group this again', () =>
                    unlock(j.id)
                  )
              }
              r.appendChild(pickBtn(j.files, r))
              body.appendChild(r)
              if (!shut) filesInto(body, j.files, j.id, null, true)
            })
            row.appendChild(body)
          }
          dropOn(row, { kind: 'loose', name: isSort ? null : n.name, day: k })
          wrap.appendChild(row)
        })
        s.appendChild(wrap)
        const openHead = wrap.querySelector('.dayrow.open .dayrow-head')
        if (openHead) wrap.style.setProperty('--dayhead', openHead.offsetHeight + 'px')
        return
      }

      if (n.kind === 'tandems') {
        const waiting = unnamedTandems()
        if (waiting.length) {
          const w = document.createElement('p')
          w.className = 'note warn'
          w.innerHTML =
            '<b>' +
            plural(waiting.length, 'tandem') +
            ' with no passenger yet.</b> Files dropped on ' +
            "Tandems land here until someone names them — never hidden inside another passenger's folder."
          s.appendChild(w)
          waiting.forEach((j) => {
            const sec = section(
              'Unnamed tandem · ' + hhmm(minT(j)),
              plural(j.files.length, 'file'),
              j.files,
              j.id,
              { kind: 'jump', id: j.id },
              (acts) => {
                const b = document.createElement('button')
                b.className = 'go'
                b.type = 'button'
                b.textContent = 'Name this tandem'
                b.addEventListener('click', () => nameTandem(j.id))
                acts.appendChild(b)
              }
            )
            s.appendChild(sec)
          })
        }
        const named = namedTandems().sort((a, b) => a.passenger.localeCompare(b.passenger))
        if (!named.length && !waiting.length) {
          s.innerHTML =
            '<div class="empty">No tandems yet. Drag a jump onto Tandems in the tree.</div>'
          return
        }
        const cards = document.createElement('div')
        cards.className = 'cards'
        named.forEach((j) => {
          const vids = j.files.filter((f) => f.kind === 'video').length
          const ready = j.files.every((f) => f.status !== 'local')
          const card = document.createElement('button')
          card.className = 'card'
          card.type = 'button'
          card.innerHTML =
            '<h3></h3><p class="sub">' +
            plural(vids, 'video') +
            ' · ' +
            plural(j.files.length - vids, 'photo') +
            ' · ' +
            hhmm(minT(j)) +
            '</p><span class="strip"></span><p class="step">' +
            (ready ? 'Next: edit the film →' : 'Next: Prepare →') +
            '</p>'
          card.querySelector('h3').textContent = j.passenger
          const strip = card.querySelector('.strip')
          j.files
            .filter((f) => f.kind === 'photo')
            .slice(0, 6)
            .forEach((f) => {
              const sp = document.createElement('span')
              sp.style.background = art(f.t)
              strip.appendChild(sp)
            })
          card.addEventListener('click', () => {
            state.node = { kind: 'pax', name: j.passenger }
            state.picked.clear()
            render()
          })
          dropOn(card, { kind: 'pax', name: j.passenger })
          cards.appendChild(card)
        })
        s.appendChild(cards)
        return
      }

      if (n.kind === 'pax') {
        const j = namedTandems().find((x) => x.passenger === n.name)
        if (!j) {
          s.innerHTML = '<div class="empty">Gone.</div>'
          return
        }
        const vids = j.files.filter((f) => f.kind === 'video')
        const pics = j.files.filter((f) => f.kind === 'photo')
        const ready = j.files.every((f) => f.status !== 'local')

        /* The explainer is about filing files into a tandem. Once it is delivered there is nothing
           left to file, so it goes — the page stops teaching and starts reporting. */
        if (!j.sent) {
          const note = document.createElement('p')
          note.className = 'note'
          note.innerHTML =
            '<b>One passenger is one folder.</b> Everything dropped here joins this tandem — the ' +
            'half-hour rule has no say once a jump has a name, so a second camera or a late clip never becomes a ' +
            'separate section under ' +
            n.name +
            '.'
          s.appendChild(note)
        }

        /* One card, and the header says which half of it you are looking at. 15 clips and 500 stills
         are two different jobs — cutting the film, then culling the photos — and nobody does both
         at once, so showing both at once only costs scrolling. */
        const kind = state.kind === 'photo' ? 'photo' : 'video'
        const shown = kind === 'video' ? vids : pics
        const who = n.name
        const opt2 = state.parcel
        const backName2 = slug(who) + '_' + dayStamp(minT(j))

        /* Once it is delivered, what matters is what is on the NAS — not the 515 files it was made
           from. Two cards, one per folder up there, each listing exactly what is in it and offering it
           back. The source files become a footnote you can still open. */
        if (j.sent) {
          const zipOf2 = (list) => Math.round(list.reduce((n2, f) => n2 + f.size, 0) * 0.98)
          const plainBackup = j.backedUp && j.backedUp.as === 'folder'

          const nasCard = (title, dir, tag, items) => {
            const c = document.createElement('div')
            c.className = 'parcel navcard'
            c.innerHTML =
              '<div class="ph"><b></b><span class="arrow">→</span><code class="dir"></code>' +
              '<span class="meta ptag">' +
              tag +
              '</span></div><div class="pitems"></div>'
            c.querySelector('b').textContent = title
            c.querySelector('.dir').textContent = dir || 'nowhere yet'
            const body = c.querySelector('.pitems')
            items.forEach((it) => {
              const row = document.createElement('div')
              row.className = 'pitem'
              row.innerHTML =
                '<span class="fixed">' +
                it.icon +
                '</span><code></code>' +
                '<span class="meta"></span><span class="meta what"></span>'
              row.querySelector('code').textContent = it.name
              row.querySelectorAll('.meta')[0].textContent = size(it.size)
              row.querySelector('.what').textContent = it.what
              const get = document.createElement('button')
              get.className = 'mini'
              get.type = 'button'
              get.textContent = 'Download'
              get.title = 'Fetch it back from ' + dir
              get.addEventListener('click', () =>
                toast(
                  'Downloading ' +
                    it.name +
                    ' (' +
                    size(it.size) +
                    ') from ' +
                    dir +
                    ' — the copy on the NAS stays where it is.'
                )
              )
              row.appendChild(get)
              body.appendChild(row)
            })
            return c
          }

          const paxCard = nasCard('For ' + who, j.sent.dir, 'shared with ' + who, [
            { icon: '▶', name: j.film.name, size: j.film.size, what: 'the film' },
            {
              icon: '🗜',
              name: slug(who) + '.photos.zip',
              size: zipOf2(pics),
              what: plural(pics.length, 'photo')
            }
          ])
          const linkRow = document.createElement('div')
          linkRow.className = 'pitem linkrow'
          linkRow.innerHTML =
            '<span class="fixed">🔗</span><code></code><span class="spacer"></span>'
          linkRow.querySelector('code').textContent = j.sent.share
          const copy = document.createElement('button')
          copy.className = 'mini'
          copy.type = 'button'
          copy.textContent = 'Copy share link'
          copy.addEventListener('click', () => toast('Share link copied: ' + j.sent.share))
          linkRow.appendChild(copy)
          paxCard.querySelector('.pitems').appendChild(linkRow)
          s.appendChild(paxCard)

          if (j.backedUp) {
            s.appendChild(
              nasCard(
                'Backup',
                j.backedUp.where,
                'never shared',
                plainBackup
