services:
  dji-ingest-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dji_skydiving_prod
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - HOST_USER=${HOST_USER:-user}
      - CAM_PHOTO_LABEL=${CAM_PHOTO_LABEL:-NANO_PHOTO}
      - CAM_VIDEO_LABEL=${CAM_VIDEO_LABEL:-NANO_VIDEO}
      - JUMP_GAP_SECONDS=${JUMP_GAP_SECONDS:-900}
      - PHOTO_FPS=${PHOTO_FPS:-2}
      - JPEG_QUALITY=${JPEG_QUALITY:-2}
      - TZ=${TZ:-UTC}
    volumes:
      - .:/app
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /media:/media:rslave
      - ${HOST_OUTPUT_DIR:-/home/${USER}/Desktop/tandem_jumps}:/output
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'
