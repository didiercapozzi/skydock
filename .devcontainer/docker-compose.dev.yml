services:
  dev_container:
    build:
      context: .
      dockerfile: Dockerfile.dev
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - $SSH_AUTH_SOCK:/ssh-agent
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace:cached
      - /media:/mnt/osmo:ro,rshared
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - CLAUDE_CONFIG_DIR=/workspace/.claude
    env_file:
      - ../.env
    command: sleep infinity
