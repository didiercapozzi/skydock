services:
  dev_container:
    build:
      context: .
      dockerfile: Dockerfile.dev
    privileged: true
    runtime: nvidia
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - $SSH_AUTH_SOCK:/ssh-agent
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace:cached
      - /media:/mnt/osmo:ro,rshared
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - CLAUDE_CONFIG_DIR=/workspace/.claude
      # `video` is the one that matters — it carries NVENC and NVDEC. `compute` brings CUDA, which
      # the hardware scaler needs, and `utility` brings nvidia-smi for checking it is all there.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    env_file:
      - ../.env
    command: sleep infinity
